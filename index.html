function tk(line,ln){
  const T=[];let i=0;
  const isD=c=>c>="0"&&c<="9", isA=c=>/[A-Za-z_]/.test(c), isAN=c=>/[A-Za-z0-9_]/.test(c);
  while(i<line.length){
    const c=line[i];
    if(c===" "||c==="\t"){i++;continue}
    if(c==="#")break;
    if(isD(c)||(c==="."&&isD(line[i+1]))){let j=i;while(j<line.length&&/[0-9.]/.test(line[j]))j++;
      T.push({t:"num",v:parseFloat(line.slice(i,j)),ln});i=j;continue}
    if(isA(c)){let j=i;while(j<line.length&&isAN(line[j]))j++;T.push({t:"name",v:line.slice(i,j),ln});i=j;continue}
    if(c==='"'||c==="'"){const q=c;let j=i+1,s="";while(j<line.length&&line[j]!==q){s+=line[j];j++}
      if(j>=line.length)throw{ln,msg:"Te faltó cerrar la comilla"};T.push({t:"str",v:s,ln});i=j+1;continue}
    const two=line.slice(i,i+2);
    if(["==","!=","<=",">=","//"].includes(two)){T.push({t:"op",v:two,ln});i+=2;continue}
    if("+-*/%<>=(),:".includes(c)){T.push({t:"op",v:c,ln});i++;continue}
    throw{ln,msg:`No entiendo el símbolo "${c}"`};
  }
  return T;
}
function P(T,ln){
  let i=0;
  const peek=()=>T[i], eat=v=>{if(T[i]&&T[i].v===v){i++;return true}return false};
  const expect=v=>{if(!eat(v))throw{ln,msg:`Esperaba "${v}" acá`}};
  function or_(){let l=and_();while(peek()&&(peek().v==="or"||peek().v==="o")){i++;l={k:"log",op:"or",l,r:and_()}}return l}
  function and_(){let l=not_();while(peek()&&(peek().v==="and"||peek().v==="y")){i++;l={k:"log",op:"and",l,r:not_()}}return l}
  function not_(){if(peek()&&(peek().v==="not"||peek().v==="no")){i++;return{k:"not",e:not_()}}return cmp_()}
  function cmp_(){let l=add_();while(peek()&&["==","!=","<=",">=","<",">"].includes(peek().v)){const o=T[i++].v;l={k:"cmp",op:o,l,r:add_()}}return l}
  function add_(){let l=mul_();while(peek()&&(peek().v==="+"||peek().v==="-")){const o=T[i++].v;l={k:"bin",op:o,l,r:mul_()}}return l}
  function mul_(){let l=un_();while(peek()&&["*","/","%","//"].includes(peek().v)){const o=T[i++].v;l={k:"bin",op:o,l,r:un_()}}return l}
  function un_(){if(peek()&&peek().v==="-"){i++;return{k:"neg",e:un_()}}return pri_()}
  function pri_(){
    const t=peek();
    if(!t)throw{ln,msg:"La línea quedó incompleta"};
    if(t.t==="num"){i++;return{k:"num",v:t.v}}
    if(t.t==="str"){i++;return{k:"str",v:t.v}}
    if(t.v==="("){i++;const e=or_();expect(")");return e}
    if(t.t==="name"){i++;
      if(peek()&&peek().v==="("){i++;const args=[];
        if(!(peek()&&peek().v===")")){args.push(or_());while(eat(","))args.push(or_())}
        expect(")");return{k:"call",n:t.v,args,ln}}
      return{k:"var",n:t.v,ln}}
    throw{ln,msg:`No esperaba "${t.v}" acá`};
  }
  const e=or_();
  if(i<T.length)throw{ln,msg:`Sobra "${T[i].v}" al final de la línea`};
  return e;
}
function parsePy(src){
  const raw=src.replace(/\r/g,"").split("\n");
  const L=[];
  raw.forEach((s,k)=>{const noC=s.split("#")[0];
    if(!noC.trim())return;
    L.push({ind:(s.match(/^[ \t]*/)[0].replace(/\t/g,"    ")).length,txt:noC.trim(),ln:k+1})});
  let p=0;
  function block(minInd){
    const out=[];
    while(p<L.length&&L[p].ind>=minInd){
      if(L[p].ind>minInd)throw{ln:L[p].ln,msg:"Esta línea tiene demasiada sangría"};
      out.push(stmt(minInd));
    }
    return out;
  }
  function body(cur,ln){
    if(p>=L.length||L[p].ind<=cur)throw{ln,msg:"Después de los dos puntos falta el bloque indentado (4 espacios)"};
    return block(L[p].ind);
  }
  function stmt(cur){
    const l=L[p], t=l.txt, ln=l.ln;
    const head=(kw)=>t===kw||t.startsWith(kw+" ")||t.startsWith(kw+"(");
    if(head("if")||head("while")){
      const kw=head("if")?"if":"while";
      if(!t.endsWith(":"))throw{ln,msg:`Al final del ${kw} falta los dos puntos ":"`};
      const cond=P(tk(t.slice(kw.length,-1),ln),ln);p++;
      const b=body(cur,ln);
      if(kw==="while")return{k:"while",cond,b,ln};
      const node={k:"if",arms:[{cond,b}],els:null,ln};
      while(p<L.length&&L[p].ind===cur&&(L[p].txt.startsWith("elif ")||L[p].txt==="else:"||L[p].txt.startsWith("else:"))){
        const e=L[p];
        if(e.txt.startsWith("elif")){
          if(!e.txt.endsWith(":"))throw{ln:e.ln,msg:'Al final del elif falta los dos puntos ":"'};
          const c2=P(tk(e.txt.slice(4,-1),e.ln),e.ln);p++;node.arms.push({cond:c2,b:body(cur,e.ln)});
        }else{p++;node.els=body(cur,e.ln);break}
      }
      return node;
    }
    if(head("for")){
      const m=t.match(/^for\s+([A-Za-z_]\w*)\s+in\s+range\((.+)\)\s*:$/);
      if(!m)throw{ln,msg:'El for se escribe así:  for i in range(5):'};
      const n=P(tk(m[2],ln),ln);p++;return{k:"for",v:m[1],n,b:body(cur,ln),ln};
    }
    if(t.startsWith("else")||t.startsWith("elif"))throw{ln,msg:`"${t.split(" ")[0]}" sin un if arriba`};
    const eq=t.search(/(?<![=!<>])=(?!=)/);
    if(eq>0&&/^[A-Za-z_]\w*\s*$/.test(t.slice(0,eq))){
      const name=t.slice(0,eq).trim(), e=P(tk(t.slice(eq+1),ln),ln);p++;return{k:"set",n:name,e,ln};
    }
    const e=P(tk(t,ln),ln);p++;
    if(e.k!=="call")throw{ln,msg:"Esta línea no hace nada. ¿Te faltó una orden o un = ?"};
    return{k:"exp",e,ln};
  }
  const prog=block(0);
  if(p<L.length)throw{ln:L[p].ln,msg:"No entiendo la sangría de esta línea"};
  return prog;
}

const LEDS=[{p:4,c:"#f87171",l:"rojo"},{p:5,c:"#fbbf24",l:"amarillo"},{p:6,c:"#34d399",l:"verde"},
            {p:8,c:"#38bdf8",l:"bomba"},{p:9,c:"#f472b6",l:"buzzer"},{p:13,c:"#e2e8f0",l:"LED placa"}];
let SIM={pins:{},an:{A0:512},out:[],vars:{},trans:0,servo:null};
let RUN={stop:true,live:false};
function simReset(keepAn){const a=keepAn?SIM.an:{A0:512};SIM={pins:{},an:a,out:[],vars:{},trans:0,servo:null}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function execPy(prog,ctx){
  const env=ctx.env;
  let steps=0, vt=0;
  const bump=()=>{if(++steps>ctx.maxSteps)throw{ln:0,msg:"El programa hizo demasiadas cosas. ¿Un bucle sin esperar()?"}};
  async function ev(n){
    bump();
    switch(n.k){
      case "num":return n.v;
      case "str":return n.v;
      case "var":{
        if(/^A[0-5]$/.test(n.n))return n.n;
        if(n.n==="True")return true; if(n.n==="False")return false;
        if(!(n.n in env))throw{ln:n.ln,msg:`La variable "${n.n}" todavía no existe. ¿La escribiste distinto arriba?`};
        return env[n.n]}
      case "neg":return -(await ev(n.e));
      case "not":return !(await ev(n.e));
      case "log":{const l=await ev(n.l);
        if(n.op==="and")return l?await ev(n.r):l; return l?l:await ev(n.r)}
      case "cmp":{const a=await ev(n.l),b=await ev(n.r);
        switch(n.op){case "==":return a===b;case "!=":return a!==b;case "<":return a<b;
          case ">":return a>b;case "<=":return a<=b;case ">=":return a>=b}}
      case "bin":{const a=await ev(n.l),b=await ev(n.r);
        switch(n.op){case "+":return (typeof a==="string"||typeof b==="string")?String(a)+String(b):a+b;
          case "-":return a-b;case "*":return a*b;
          case "/":{if(b===0)throw{ln:n.ln,msg:"No se puede dividir por cero"};return a/b}
          case "//":return Math.floor(a/b);case "%":return a%b}}
      case "call":return await call(n);
    }
  }
  async function call(n){
    const a=[];for(const x of n.args)a.push(await ev(x));
    const need=(k)=>{if(a.length<k)throw{ln:n.ln,msg:`A ${n.n}() le faltan datos adentro del paréntesis`}};
    switch(n.n){
      case "prender":{need(1);const p=+a[0];if(SIM.pins[p]!==1)SIM.trans++;SIM.pins[p]=1;ctx.paint();return null}
      case "apagar":{need(1);const p=+a[0];if(SIM.pins[p]===1)SIM.trans++;SIM.pins[p]=0;ctx.paint();return null}
      case "leer":{need(1);const p=a[0];const v=SIM.an[p];
        if(v===undefined)throw{ln:n.ln,msg:`No hay ningún sensor en ${p}. Probá con A0`};return v}
      case "mostrar":{need(1);SIM.out.push(String(typeof a[0]==="number"?Math.round(a[0]*100)/100:a[0]));
        if(SIM.out.length>200)SIM.out.shift();ctx.paint();return null}
      case "servo":{need(2);SIM.servo=+a[1];ctx.paint();return null}
      case "esperar":{need(1);const s=Math.max(0,+a[0]);
        if(ctx.live){await sleep(Math.min(s,3)*1000)}else{vt+=s;if(vt>ctx.maxVT)throw{stopok:true}}
        return null}
      case "redondear":{need(1);return Math.round(a[0])}
      case "range":throw{ln:n.ln,msg:"range() solo se usa adentro de un for"};
      default:throw{ln:n.ln,msg:`No conozco la orden "${n.n}()". Mirá la lista de órdenes abajo.`};
    }
  }
  async function block(b){for(const s of b){if(RUN.stop&&ctx.live)throw{stopok:true};await run1(s)}}
  async function run1(s){
    bump();
    switch(s.k){
      case "set":{env[s.n]=await ev(s.e);SIM.vars=Object.assign({},env);ctx.paint();return}
      case "exp":await ev(s.e);return;
      case "if":{for(const arm of s.arms){if(await ev(arm.cond))return await block(arm.b)}
        if(s.els)return await block(s.els);return}
      case "while":{let guard=0;
        while(await ev(s.cond)){
          await block(s.b);
          if(ctx.live){await sleep(0)}else{vt+=0.001;if(vt>ctx.maxVT)throw{stopok:true}}
          if(RUN.stop&&ctx.live)throw{stopok:true};
          if(++guard>ctx.maxLoop)throw{stopok:true};
        }return}
      case "for":{const n=Math.min(+(await ev(s.n)),ctx.maxLoop);
        for(let k=0;k<n;k++){env[s.v]=k;SIM.vars=Object.assign({},env);await block(s.b);
          if(ctx.live){await sleep(0)}
          if(RUN.stop&&ctx.live)throw{stopok:true}}
        return}
    }
  }
  await block(prog);
}

/* corre el código; devuelve {err, pins, out, trans, servo} */
async function misRunCode(code,opt){
  opt=opt||{};
  const live=!!opt.live;
  simReset(!!opt.keepAn);
  if(opt.an)SIM.an=Object.assign({},SIM.an,opt.an);
  const ctx={env:{},live,paint:live?misPaint:()=>{},maxSteps:live?4e6:2e5,maxVT:opt.maxVT||14,maxLoop:live?1e9:4000};
  RUN.stop=false;RUN.live=live;
  let err=null;
  try{
    const prog=parsePy(code);
    if(!prog.length)err={ln:0,msg:"Todavía no escribiste ninguna orden."};
    else await execPy(prog,ctx);
  }catch(e){ if(!e||!e.stopok) err=(e&&e.msg)?e:{ln:0,msg:"Algo salió mal: "+(e&&e.message||e)} }
  RUN.stop=true;
  if(live)misPaint();
  return {err,pins:Object.assign({},SIM.pins),out:SIM.out.slice(),trans:SIM.trans,servo:SIM.servo};
}

     Pensalo en dos pasos: ¿cuántos grados hay de punta a punta, de -10 hasta 40? Y después, ¿desde dónde arranca?`,
 s:"crudo = leer(A0)\n",
 chk:async r=>{
   for(const v of [0,512,1023]){const x=await r({an:{A0:v}});
     if(x.err)return{ok:false,msg:""};
     const last=[...x.out].reverse().find(o=>!isNaN(parseFloat(o)));
     if(last===undefined)return{ok:false,msg:"No mostraste nada todavía."};
     const debe=v*50/1023-10;
     if(Math.abs(parseFloat(last)-debe)>0.6)
       return{ok:false,msg:`Con el sensor en ${v} tendría que dar ${debe.toFixed(1)} grados y mostraste ${last}.`}}
   return{ok:true,msg:"De punta a punta hay 50 grados y la escala arranca en -10. Con esos dos números se convierte cualquier cosa en cualquier otra."}}},

{t:"El sensor al revés",c:"cuando la cuenta baja",
 g:"Este sensor marca MÁS cuando hay MENOS agua: con 0 la tierra está empapada (100%) y con 1023 está seca (0%). Mostrá el porcentaje de humedad.",
 th:`Existen de verdad, y son una trampa clásica: el aparato queda funcionando al revés y nadie se da
     cuenta hasta que la planta se seca.<br>
     Si el sensor marca 0 tenés que mostrar 100, y si marca 1023 tenés que mostrar 0.
     ¿Cómo hacés para que la cuenta <b>baje</b> en vez de subir?`,
 s:"crudo = leer(A0)\n",
 chk:async r=>{
   for(const v of [200,800]){const x=await r({an:{A0:v}});
     if(x.err)return{ok:false,msg:""};
     const last=[...x.out].reverse().find(o=>!isNaN(parseFloat(o)));
     if(last===undefined)return{ok:false,msg:"No mostraste nada todavía."};
     const debe=100-mpct(v);
     if(Math.abs(parseFloat(last)-debe)>1.5)
       return{ok:false,msg:`Con el sensor en ${v} tendría que dar ${debe.toFixed(1)}% y mostraste ${last}.`}}
   return{ok:true,msg:"La cuenta ahora baja en vez de subir. Si dibujaras los puntos en un gráfico, la línea iría para abajo."}}},

{t:"Parpadeá exactamente 5 veces",c:"for · repetir una cantidad",
 g:"Hacé que el LED del pin 13 parpadee 5 veces y después pare. Ni una más ni una menos.",
 th:`<code>while True</code> repite sin final. Para repetir una cantidad conocida de veces:<br>
     <code>for i in range(5):</code> y abajo, indentado, lo que se repite.<br>
     Mientras corre, <code>i</code> va valiendo 0, 1, 2, 3 y 4. Podés usar ese valor o ignorarlo.
     Probá poner <code>mostrar(i)</code> adentro para verlo.`,
 s:"",
 chk:async r=>{
   const x=await r({an:{A0:512}});
   if(x.err)return{ok:false,msg:""};
   if(x.trans===0)return{ok:false,msg:"El LED nunca se prendió."};
   if(x.trans<10)return{ok:false,msg:`Parpadeó ${Math.floor(x.trans/2)} veces y tendrían que ser 5. ¿Le pusiste el apagar( ) adentro del for?`};
   if(x.trans>10)return{ok:false,msg:`Parpadeó de más (${Math.floor(x.trans/2)} veces). Si usaste while True, cambialo por for i in range(5).`};
   return{ok:true,msg:"Parpadea cinco veces y se detiene. Probá cambiar el 5 y volvé a ejecutar."}}},

{t:"Promediá varias lecturas",c:"acumulador · sumar dentro de un for",
 g:"Leé el sensor 5 veces sumando los valores. Mostrá primero la SUMA y después el PROMEDIO.",
 th:`Un sensor real no da siempre el mismo número: <b>salta</b>. La forma más simple de estabilizarlo es
     leerlo varias veces y promediar.<br>
     Necesitás una variable que vaya <b>acumulando</b>:<br>
     <code>suma = 0</code><br><code>for i in range(5):</code><br>
     <code>&nbsp;&nbsp;&nbsp;&nbsp;suma = suma + leer(A0)</code><br>
     Y al final <code>mostrar(suma)</code> y <code>mostrar(suma / 5)</code>.<br>
     <i>Acá el simulador da siempre lo mismo, así que el promedio va a coincidir con la lectura.
     En el aparato de verdad no, y por eso esto sirve.</i>`,
 s:"suma = 0\n",
 chk:async r=>{
   for(const v of [300,800]){const x=await r({an:{A0:v}});
     if(x.err)return{ok:false,msg:""};
     const nums=x.out.map(parseFloat).filter(n=>!isNaN(n));
     if(nums.length<2)return{ok:false,msg:"Tenés que mostrar dos cosas: primero la suma y después el promedio."};
     const suma=nums[nums.length-2], prom=nums[nums.length-1];
     if(Math.abs(suma-v*5)>1)return{ok:false,msg:`Con el sensor en ${v} la suma de 5 lecturas tendría que dar ${v*5} y mostraste ${suma}.`};
     if(Math.abs(prom-v)>1)return{ok:false,msg:`El promedio tendría que dar ${v} y mostraste ${prom}. Es la suma dividida 5.`}}
   return{ok:true,msg:"Acá el promedio da igual que la lectura, porque el sensor simulado no se mueve solo. Con el sensor de verdad no va a dar igual."}}},

{t:"Que no titile",c:"banda de seguridad (histéresis)",
 g:"Prendé la bomba (pin 8) cuando la humedad baje de 28%. Apagala cuando pase de 32%. Entre 28 y 32 no la toques: dejala como está.",
 th:`Si prendés por debajo de 30 y apagás por encima de 30, cuando el valor queda temblando en el
     borde la bomba se prende y se apaga muchas veces por minuto.<br>
     Una salida es usar <b>dos números</b> en vez de uno y dejar un hueco en el medio:<br>
     <code>if porcentaje < 28:</code> prender<br>
     <code>elif porcentaje > 32:</code> apagar<br>
     Sin <code>else</code>. Si el valor cae en el hueco, el programa no hace nada y la bomba queda
     como estaba.<br>
     Ese hueco se llama <b>histéresis</b>. El de una heladera se puede escuchar: por eso arranca
     cada tanto y no todo el tiempo.`,
 s:"crudo = leer(A0)\nporcentaje = crudo * 100 / 1023\n",
 chk:async r=>{
   for(const [v,debe] of [[250,1],[500,0]]){const x=await r({an:{A0:v}});
     if(x.err)return{ok:false,msg:""};
     const es=x.pins[8]===1?1:0;
     if(es!==debe)return{ok:false,msg:`Con el sensor al ${mpct(v).toFixed(0)}% la bomba tendría que estar ${debe?"prendida":"apagada"}.`}}
   const z=await r({an:{A0:307}});
   if(z.err)return{ok:false,msg:""};
   if(z.pins[8]!==undefined)return{ok:false,msg:"Con el sensor al 30% estás en la zona muerta: ahí el programa NO tiene que tocar la bomba, ni prenderla ni apagarla. Fijate que no te haya quedado un else, o un apagar( ) suelto arriba de todo."};
   return{ok:true,msg:"Entre 28 y 32 el programa no toca nada. La bomba se queda como estaba. Esa zona vacía es lo que evita que titile."}}},

{t:"Abrí la compuerta",c:"servo · mover algo",
 g:"Si la temperatura pasa de 60%, abrí la compuerta del invernadero: servo(9, 90). Si no, cerrala: servo(9, 0).",
 th:`Un <b>servo</b> va a un ángulo exacto y se queda ahí hasta que le mandes otro.<br>
     <code>servo(9, 90)</code> lo lleva a 90 grados. <code>servo(9, 0)</code> lo vuelve a cero.<br>
     Un motor común gira mientras tenga corriente y no sabés dónde quedó. Esa diferencia es la que
     decide cuál de los dos sirve para una tapa que abre y cierra.`,
 s:"crudo = leer(A0)\ntemperatura = crudo * 100 / 1023\n",
 chk:async r=>{
   const casos=[[900,90],[200,0],[700,90]];
   for(const [v,ang] of casos){const x=await r({an:{A0:v}});
     if(x.err)return{ok:false,msg:""};
     if(x.servo===null)return{ok:false,msg:"Todavía no moviste el servo. Usá servo(9, 90) o servo(9, 0)."};
     if(x.servo!==ang)return{ok:false,msg:`Con la temperatura al ${mpct(v).toFixed(0)}% el servo tendría que estar en ${ang} grados y está en ${x.servo}.`}}
   return{ok:true,msg:"El servo se queda en el ángulo que le mandaste hasta que le mandes otro. Movelo despacio con el deslizador y mirá cuándo cambia."}}},

/* ===== visuales: que el código se vea pasar ===== */

{t:"La luz que corre",c:"for + secuencia",

 th:`Todo lo que hace falta acá ya lo usaste antes. Lo que cambia es cómo se combina.<br>

     Probá primero sin ningún <code>esperar( )</code> y mirá qué se ve. Después poné

   return{ok:true,msg:"La luz recorre los tres LEDs. Probá invertir el orden, o sacar los esperar( ) y ver qué pasa."}}},

{t:"La barra de nivel",c:"if / elif que se acumulan",
 g:"Mostrá la humedad como una barra: menos de 33% prendé solo el 4. Entre 33 y 66 prendé el 4 y el 5. Más de 66 prendé los tres (4, 5 y 6).",
 th:`Los LEDs se van <b>sumando</b> en vez de reemplazarse, como las rayitas de la señal del celular.<br>

 s:"crudo = leer(A0)\nporcentaje = crudo * 100 / 1023\napagar(4)\napagar(5)\napagar(6)\n",

   const casos=[[200,[1,0,0]],[500,[1,1,0]],[900,[1,1,1]]];

   return{ok:true,msg:"Los LEDs se suman en vez de reemplazarse. Movés el sensor despacio y la barra sube."}}},

{t:"Cuenta regresiva",c:"for + mostrar",
 g:"Mostrá 5, 4, 3, 2, 1 (uno por vez, en ese orden) y recién ahí prendé el LED del pin 13.",
 th:`<code>range(5)</code> te da 0, 1, 2, 3, 4 — en ese orden, de menor a mayor.<br>
     Si querés que baje, hacé la cuenta vos: si <code>i</code> vale 0, entonces <code>5 - i</code> vale 5.<br>
     <code>for i in range(5):</code><br><code>&nbsp;&nbsp;&nbsp;&nbsp;mostrar(5 - i)</code>`,

   return{ok:true,msg:"La cuenta baja aunque el for suba. La variable i sigue yendo de 0 a 4: lo que cambiaste es qué hacés con ella."}}},

{t:"El servo sigue al sensor",c:"escalar a otro rango",
 g:"Movés el sensor y el servo acompaña. El sensor va de 0 a 1023 y el servo de 0 a 180 grados. Convertí y mandá: servo(9, angulo).",
 th:`Ya llevaste el valor del sensor de 0-1023 a 0-100. Ahora el destino es 0 a 180.<br>
     <code>angulo = crudo * 180 / 1023</code><br>
     Es la misma cuenta con otro número arriba: antes 100, ahora 180.
     Si dibujaras las dos en un gráfico, ¿en qué se parecerían y en qué no?<br>
     <code>redondear( )</code> te deja un ángulo entero.`,

   for(const v of [0,512,1023,300]){const x=await r({an:{A0:v}});

     const esp=v*180/1023;

{t:"El aparato completo",c:"integrador",
 g:"Juntá todo. Leé el sensor y pasalo a porcentaje. Si está por debajo de 30 prendé la bomba (8) y el rojo (4). Si está entre 30 y 70 prendé solo el verde (6). Si pasa de 70 prendé el amarillo (5) y el buzzer (9) porque se está encharcando. Un solo estado a la vez, y mostrá el porcentaje.",
 th:`Nada de esto es nuevo por separado: variable, cuenta, <code>if / elif / else</code>, y varias

     Conviene empezar apagando todo, para que no queden luces de la vuelta anterior.<br>
     Este esqueleto es el mismo que van a necesitar los cuatro aparatos que diseñaron el 5 de agosto.`,

 chk:async r=>{
   const casos=[[200,{8:1,4:1,6:0,5:0,9:0}],[500,{6:1,8:0,4:0,5:0,9:0}],[900,{5:1,9:1,8:0,4:0,6:0}]];

     const nums=x.out.map(parseFloat).filter(n=>!isNaN(n));

     if(Math.abs(nums[nums.length-1]-mpct(v))>1.5)return{ok:false,msg:`Estás mostrando ${nums[nums.length-1]} y el porcentaje es ${mpct(v).toFixed(1)}.`}}
   return{ok:true,msg:"Esto que escribiste es un aparato entero: se entera, decide y actúa. Con este mismo esqueleto se programan los cuatro que diseñaron el 5 de agosto."}}}
];

/* ---------- pantallas del track ---------- */
function misHome(){
  cur=null; rload();
  const rows=MIS.map((m,i)=>{
    const done=RDONE.includes(i), lock=i>0&&!RDONE.includes(i-1)&&!done;
    return `<div class="mrow ${done?"done":""} ${lock?"lock":""}" ${lock?"":`onclick="misGo(${i})"`}>
      <div class="mnum">${done?"✓":i+1}</div>
      <div class="mt">${m.t}<div class="mc">${m.c}</div></div>
      <div class="muted">${lock?"más adelante":"→"}</div></div>`}).join("");
  const hechas=RDONE.length;
  app.innerHTML=`
    <div class="topbar"><button class="backb" onclick="menu()">← Menú</button>
      <div class="progtext">${hechas} de ${MIS.length} misiones</div></div>
    <div class="card">
      <div class="concepto big">Programá la placa</div>
      <h2 style="margin-top:0">Misiones</h2>
      <p class="muted" style="margin:0 0 4px;line-height:1.6">Abajo hay una placa con luces, un buzzer,
      un servo y un sensor que podés mover con el mouse. Vos escribís las órdenes; ella hace lo que dice
      el programa, no lo que vos querías que dijera.<br>
      Cada misión deja abierta la siguiente. Podés volver a cualquiera que ya hayas hecho y cambiarla.</p>
    </div>
    <div class="card">
      <div class="mgrid">${rows}</div>
      <button class="btn ghost" onclick="misGo(-1)" style="margin-top:14px">Modo libre — sin consigna y sin corrección</button>
    </div>`;
  window.scrollTo(0,0);
}
function misGo(i){
  RM=i; simReset(false); rload(); MIS_T0=Date.now(); MIS_TRIES=0;
  const m=i>=0?MIS[i]:{t:"Modo libre",c:"probá lo que quieras",g:"Escribí lo que se te ocurra y ejecutá. Acá no hay consigna ni corrección.",th:"",s:"# probá lo que quieras\n"};
  const saved=localStorage.getItem(rkeyMisiones()+"_code_"+i);
  app.innerHTML=`<div class="mrowrap"><div class="card">
    <div class="mconsigna"><div class="mcl">${i>=0?"CONSIGNA":"LIBRE"} · ${m.c}</div><p>${m.g}</p></div>
    ${m.th?`<details class="teoria" ${RDONE.includes(i)?"":"open"}><summary style="cursor:pointer;font-weight:700">Cómo funciona</summary>
      <div style="margin-top:8px">${m.th}</div></details>`:""}
    <textarea class="ed" id="mised" spellcheck="false" onkeydown="misEdKeys(event)">${saved!==null?saved:m.s}</textarea>
    <div class="runbar">
      <button class="btn" onclick="misRun()">▶ Ejecutar</button>
      <button class="btn ghost" onclick="misStop()">■ Detener</button>
      ${i>=0?`<button class="btn" onclick="misCheck()" style="background:linear-gradient(90deg,var(--good),var(--accent))">Comprobar</button>`:""}
    </div>
    <div id="misfb"></div>
    ${misBoardHTML()}
    <details class="teoria"><summary style="cursor:pointer;font-weight:700">Órdenes que entiende la placa</summary>
      <div style="margin-top:8px;line-height:2">
      <code>prender(13)</code> prende el pin ·
      <code>apagar(13)</code> lo apaga ·
      <code>esperar(1)</code> frena 1 segundo ·
      <code>leer(A0)</code> devuelve lo que mide el sensor (0 a 1023) ·
      <code>mostrar(x)</code> escribe en el monitor ·
      <code>servo(9, 90)</code> mueve el servo a 90 grados<br>
      Estructuras: <code>if / elif / else</code> · <code>while True:</code> · <code>for i in range(5):</code>
      </div></details>
    <button class="btn ghost" onclick="misHome()">← Volver a las misiones</button>
  </div></div>`;
  misPaint();
}
function misBoardHTML(){
  return `<div class="board">
    <div class="pins" id="mispins"></div>
    <div class="sensorbox">
      <label style="margin-top:0">Sensor conectado en A0 — movelo para simular la tierra</label>
      <input type="range" id="misan" min="0" max="1023" value="${SIM.an.A0}" oninput="misAnMove(this.value)">
      <div class="sread"><span>seco</span><span>crudo: <b id="misanv">${SIM.an.A0}</b> &nbsp; = &nbsp; <b id="misanp">${mpct(SIM.an.A0).toFixed(0)}%</b></span><span>mojado</span></div>
    </div>
    <div class="monitor" id="mismon"><span class="ph">El monitor muestra lo que escribas con mostrar( )</span></div>
    <div class="vars" id="misvars"></div>
  </div>`;
}
function misAnMove(v){SIM.an.A0=+v;
  const a=document.getElementById("misanv"),b=document.getElementById("misanp");
  if(a)a.textContent=v; if(b)b.textContent=mpct(+v).toFixed(0)+"%";}
function misPaint(){
  const P=document.getElementById("mispins");
  if(P)P.innerHTML=LEDS.map(l=>`<div class="mpin">
      <div class="mbulb ${SIM.pins[l.p]===1?"on":""}" style="color:${l.c}"></div>
      <div class="pn">${l.p}</div><div class="pl">${l.l}</div></div>`).join("")+
    (SIM.servo!==null?`<div class="mpin"><div class="mbulb on" style="color:#a78bfa;transform:rotate(${SIM.servo}deg)"></div>
      <div class="pn">servo</div><div class="pl">${SIM.servo}°</div></div>`:"");
  const M=document.getElementById("mismon");
  if(M)M.innerHTML=SIM.out.length?SIM.out.slice(-40).join("\n"):`<span class="ph">El monitor muestra lo que escribas con mostrar( )</span>`;
  if(M)M.scrollTop=M.scrollHeight;
  const V=document.getElementById("misvars");
  if(V)V.innerHTML=Object.keys(SIM.vars).map(k=>`<span class="vpill"><b>${k}</b> = ${
    typeof SIM.vars[k]==="number"?Math.round(SIM.vars[k]*100)/100:SIM.vars[k]}</span>`).join("");
}
function misEdKeys(e){
  const ta=e.target;
  if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart;
    ta.value=ta.value.slice(0,s)+"    "+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+4;return}
  if(e.key==="Enter"){e.preventDefault();
    const s=ta.selectionStart,before=ta.value.slice(0,s);
    const line=before.slice(before.lastIndexOf("\n")+1);
    let ind=(line.match(/^[ \t]*/)||[""])[0];
    if(/:\s*$/.test(line))ind+="    ";
    const ins="\n"+ind;
    ta.value=before+ins+ta.value.slice(ta.selectionEnd);
    ta.selectionStart=ta.selectionEnd=s+ins.length;}
}
function misEdCode(){const e=document.getElementById("mised");if(e)localStorage.setItem(rkeyMisiones()+"_code_"+RM,e.value);return e?e.value:""}
function misFb(html){const f=document.getElementById("misfb");if(f)f.innerHTML=html}
function misErrHTML(e){return `<div class="merr"><b>${e.ln?`Línea ${e.ln}: `:""}</b>${e.msg}</div>`}

async function misRun(){
  const code=misEdCode();
  misFb(`<div class="muted" style="margin-top:8px">Ejecutando… <span class="run-dots"></span></div>`);
  const r=await misRunCode(code,{live:true,keepAn:true});
  misFb(r.err?misErrHTML(r.err):"");
}
function misStop(){RUN.stop=true}
async function misCheck(){
  const code=misEdCode(), m=MIS[RM];
  MIS_TRIES++;
  misFb(`<div class="muted" style="margin-top:8px">Comprobando… <span class="run-dots"></span></div>`);
  let firstErr=null;
  const runner=async o=>{const r=await misRunCode(code,Object.assign({live:false},o));if(r.err&&!firstErr)firstErr=r.err;return r};
  let res;
  try{res=await m.chk(runner)}catch(e){res={ok:false,msg:"No pude comprobarlo."}}
  if(firstErr){misFb(misErrHTML(firstErr));return}
  if(res.ok){
    if(!RDONE.includes(RM)){RDONE.push(RM);rsave();guardarMision(RM)}
    misFb(`<div class="mverdict ok">${res.msg}</div>
      <div class="runbar" style="margin-top:12px">
        ${RM+1<MIS.length?`<button class="btn" onclick="misGo(${RM+1})">Ir a la siguiente →</button>`:``}
        <button class="btn ghost" onclick="misHome()">Volver a las misiones</button>
      </div>
      <p class="muted" style="font-size:.84rem;margin:10px 0 0">Podés quedarte acá y seguir probando
      cambios en este programa. Queda guardado.</p>`);
  }else{
    misFb(`<div class="mverdict no">${res.msg}</div>`);
  }
  simReset(true);misPaint();
}

/* clave del progreso de misiones: una por alumno y año.
   Va como funcion para que exista desde el arranque del script. */
function rkeyMisiones(){
  const s=(typeof SES!=='undefined' && SES)
    ? SES.anio+'|'+String(SES.nombre||'').trim().toLowerCase() : 'anon';
  return 'vla_robotica_v1.'+s;
}
/* misiones resueltas, leidas directo del navegador. No usa RDONE a proposito:
   se declara mas abajo y todavia no existe cuando boot() dibuja el menu. */
function misionesHechas(){
  try{ const a=JSON.parse(localStorage.getItem(rkeyMisiones())); return Array.isArray(a)?a:[] }
  catch(e){ return [] }
}

/* ---- el camino: acomoda las estaciones en serpentina y dibuja la curva ---- */
function dibujarSendero(){
  const cont=document.getElementById('sendero'); if(!cont) return;
  const lista = cont.querySelectorAll ? cont.querySelectorAll('.est') : null;
  const nodos = lista ? Array.prototype.slice.call(lista) : [];
  if(nodos.length<2) return;
  let cols=1;
  try{ cols=(getComputedStyle(cont).gridTemplateColumns||'').split(' ').filter(Boolean).length||1; }catch(e){}

  /* serpentina: la fila 1 va de izquierda a derecha, la 2 al revés, y así */
  nodos.forEach((n,i)=>{
    const fila=Math.floor(i/cols), enFila=i%cols;
    const col=(fila%2===0) ? enFila : (cols-1-enFila);
    n.style.gridColumn=String(col+1);
    n.style.gridRow=String(fila+1);
  });
  if(cols<2) { const sv=document.getElementById('rutaSvg'); if(sv) sv.innerHTML=''; return; }

  const pintar=()=>{
    const svg=document.getElementById('rutaSvg'); if(!svg) return;
    const cr=cont.getBoundingClientRect();
    if(!cr.width || !cr.height){ svg.innerHTML=''; return; }
    const pts=nodos.map(n=>{
      const r=n.getBoundingClientRect();
      return {x:r.left-cr.left+r.width/2, y:r.top-cr.top+r.height/2,
              hecho:n.classList.contains('pas')};
    });
    let ultimoHecho=0;
    pts.forEach((p,i)=>{ if(p.hecho) ultimoHecho=i; });

    const curva=(p)=>{
      if(p.length<2) return '';
      let d='M '+p[0].x+' '+p[0].y;
      for(let i=0;i<p.length-1;i++){
        const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p[i+1], t=.32;
        d+=' C '+(p1.x+(p2.x-p0.x)*t)+' '+(p1.y+(p2.y-p0.y)*t)+', '+
               (p2.x-(p3.x-p1.x)*t)+' '+(p2.y-(p3.y-p1.y)*t)+', '+p2.x+' '+p2.y;
      }
      return d;
    };
    const dHecho = curva(pts.slice(0, ultimoHecho+1));
    const dFalta = curva(pts.slice(ultimoHecho));

    svg.setAttribute('viewBox','0 0 '+cr.width+' '+cr.height);
    svg.innerHTML =
      (dFalta?`<path d="${dFalta}" fill="none" stroke="var(--line2)" stroke-width="2.5"
                 stroke-linecap="round" stroke-dasharray="2 11"/>`:'')+
      (dHecho?`<path id="rutaHecha" d="${dHecho}" fill="none" stroke="var(--accent)"
                 stroke-width="2.5" stroke-linecap="round" opacity=".55"/>`:'');

    /* flechitas cada tanto, para que se lea el sentido del recorrido */
    const ph=document.getElementById('rutaHecha');
    if(ph && ph.getTotalLength){
      const L=ph.getTotalLength(); let marcas='';
      for(let d=64; d<L-24; d+=132){
        const a=ph.getPointAtLength(d), b=ph.getPointAtLength(Math.min(L,d+9));
        const g=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
        marcas+=`<path d="M -5 -4.5 L 3 0 L -5 4.5" fill="none" stroke="var(--accent)"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   opacity=".8" transform="translate(${a.x} ${a.y}) rotate(${g})"/>`;
      }
      svg.innerHTML += marcas;
    }
  };
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(pintar); else pintar();
}
let _redibujo=null;
if(typeof window!=='undefined' && window.addEventListener){
  window.addEventListener('resize',()=>{ clearTimeout(_redibujo); _redibujo=setTimeout(dibujarSendero,140); });
}

function mapaHTML(){
  if(!SES || SES.anio!=='3ro') return '';
  const hechas = misionesHechas();
  let primeraPendiente=true, n=0;
  const casillas = via3().map(tr=>{
    let primeraDelTramo=true;
    return tr.es.map(e=>{
      n++;
      const hecho = !!e.ok(hechas);
      let cls='pas';
      if(!hecho){
        if(primeraPendiente && tr.tn.indexOf('viene')<0){ cls='hoy'; primeraPendiente=false; }
        else cls='vie';
      }
      const eyebrow = primeraDelTramo ? `<span class="tr">${tr.tn}</span>` : '';
      primeraDelTramo=false;
      const cuerpo = `<span class="num">${n}</span>${eyebrow}
        <span class="tt">${e.t}</span><span class="sb">${e.i}</span>`;
      return e.fn
        ? `<button class="est ${cls} link" onclick="${e.fn}">${cuerpo}</button>`
        : `<div class="est ${cls}">${cuerpo}</div>`;
    }).join('');
  }).join('');
  return `<div class="mapa">
    <div class="mh"><b>El camino que vienen haciendo</b>
      <span>Empezó en marzo mirando datos que había medido otro. Cada casilla que ya
      recorrieron está llena; podés volver a cualquiera.</span></div>
    <div class="sendero" id="sendero"><svg class="ruta" id="rutaSvg" aria-hidden="true"></svg>${casillas}</div>
    <p class="pie">Nada de esto se dio suelto: cada cosa apareció porque hacía falta para la
    siguiente. Si mirás el recorrido de punta a punta, el hilo es uno solo — primero miraron
    datos que había medido otro, y ahora están construyendo la máquina que los produce.</p>
  </div>`;
}
