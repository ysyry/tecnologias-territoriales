/* -------------------- EL BAILE (coreografía) --------------------
   Secuencia sin una sola palabra para leer: armás una coreografía con
   pasos y la bailarina la hace en orden. Es el mismo concepto de algoritmo
   que el resto del año, con otro cuerpo.
   El compás se VE (los puntos de arriba) además de escucharse, porque en la
   escuela puede no haber parlantes y porque el sonido acá es refuerzo.
   Cada paso tiene su nota: las seis forman una escala pentatónica, así que
   CUALQUIER coreografía suena bien y la misma secuencia suena siempre igual.
   Esa es la idea: la secuencia se ve, se escucha y se baila a la vez.
   Los cuatro primeros son "copiá la que te muestro"; el cuarto se puede
   resolver con el 🔁, que es un bucle sin decirle bucle. El último es libre. */
const BA_PASOS=[
  {id:'A', ic:'🙌', nom:'brazos arriba',  f:523.25},
  {id:'P', ic:'👏', nom:'aplauso',        f:587.33},
  {id:'G', ic:'🔄', nom:'giro',           f:659.25},
  {id:'C', ic:'➡️', nom:'paso al costado', f:783.99},
  {id:'S', ic:'🤸', nom:'salto',          f:880.00},
  {id:'R', ic:'🙇', nom:'saludo',         f:392.00}
];
const BA_IC={}, BA_NOM={}, BA_F={};
BA_PASOS.forEach(p=>{ BA_IC[p.id]=p.ic; BA_NOM[p.id]=p.nom; BA_F[p.id]=p.f; });
const BAILES=[
  {seq:['A','P']},
  {seq:['S','S']},
  {seq:['G','A','P']},
  {seq:['R','G','S']},
  {seq:['C','S','P','A']},
  {seq:['A','P','A','P'], repe:true},
  {seq:['G','C','G','C'], repe:true},
  {seq:['A','P','S','G','R']},
  {libre:true}
];
let baState;
function baInicio(idx){
  cur=null;
  const n=BAILES[idx];
  baState={idx, n, prog:[], playing:false, intentos:0, t0:Date.now(),
           usoRepe:false, guardado:false, mal:-1};
  baRender();
  if(!n.libre) setTimeout(baMostrar, 600);
}
function baRender(msg){
  const {n,prog,idx}=baState;
  const dots=puntosNivel(BAILES.length, idx, 'baInicio');
  const pasos=BA_PASOS.map(p=>`<button class="bapaso" onclick="baAdd('${p.id}')" aria-label="${p.nom}">${p.ic}${
    PALAB?`<span class="bapal">${p.nom}</span>`:''}</button>`).join('');
  const cuantos = n.libre ? Math.max(prog.length,4) : n.seq.length;
  const pulsos=[]; for(let i=0;i<cuantos;i++) pulsos.push(`<span class="bapulso" id="bu${i}"></span>`);
  const muestra = n.libre ? '' :
    `<div class="bamuestra">${n.seq.map((s,i)=>`<span class="ic" id="bm${i}">${BA_IC[s]}</span>`).join('')}</div>`;
  app.innerHTML=`
    <div class="topbar"><button class="backb" onclick="menu()" aria-label="volver">←</button>
      <div class="progtext" style="letter-spacing:3px;color:var(--b1)">${dots}</div>
      <div class="baopts">${btnsAyuda(true)}</div></div>
    <div class="card bawrap">
     <div class="jrcols">
      <div>
        <div class="baesc"><div class="bapiso"></div><div class="badan" id="badan">💃</div></div>
        <div class="bacompas">${pulsos.join('')}</div>
        ${muestra}
      </div>
      <div>
        <div class="jrmsg" id="bamsg" role="status" aria-live="polite">${msg||''}</div>
        <div class="jrstrip" aria-label="tu coreografía">${prog.length?prog.map((a,k)=>`<span class="${k===baState.mal?'bamal':''}">${BA_IC[a]}</span>`).join(' ')+(baState.mal===prog.length?' <span class="bamal">▫️</span>':''):'<span style="opacity:.3;font-size:2rem">▫️ ▫️ ▫️</span>'}</div>
        <div class="bapasos">${pasos}</div>
        <div class="jrbtns bactrl">
          <button class="jrgo" onclick="baRun()" aria-label="que baile">▶</button>
          ${n.repe?`<button class="bapaso chico" onclick="baRepetir()" aria-label="otra vez">🔁</button>`:''}
          <button class="bapaso chico" onclick="baUndo()" aria-label="borrar el último">↩️</button>
          <button class="bapaso chico" onclick="baClear()" aria-label="borrar">🗑️</button>
          ${n.libre?'':`<button class="bapaso chico" onclick="baMostrar()" aria-label="mirar de nuevo">👀</button>`}
        </div>
      </div>
     </div>
    </div>`;
}
function baAdd(id){
  if(baState.playing || baState.prog.length>=12) return;
  baState.prog.push(id); baState.mal=-1;
  tono(BA_F[id],.26); decir(BA_NOM[id]);
  baRender();
}
function baClear(){ if(baState.playing) return; baState.prog=[]; baState.mal=-1; baRender(); }
function baUndo(){ if(baState.playing || !baState.prog.length) return; baState.prog.pop(); baState.mal=-1; tono(392,.12); baRender(); }
/* el 🔁: repetir lo que ya armó. Es un bucle, y no hace falta nombrarlo. */
function baRepetir(){
  if(baState.playing || !baState.prog.length) return;
  baState.prog=baState.prog.concat(baState.prog);
  baState.usoRepe=true; baState.mal=-1; baRender();
}
function baApagar(){
  for(let k=0;k<24;k++){
    const pu=document.getElementById('bu'+k); if(pu) pu.classList.remove('on');
    const m=document.getElementById('bm'+k); if(m) m.classList.remove('on');
  }
}
/* la bailarina hace la secuencia, un paso por compás */
function baBailar(seq, marcar, cb){
  baApagar();
  const dan=document.getElementById('badan');
  let i=0;
  const paso=()=>{
    if(i>=seq.length){ if(dan) dan.className='badan'; if(cb) cb(); return; }
    const s=seq[i];
    if(dan) dan.className='badan p'+s;
    tono(BA_F[s]||440,.3);
    const pu=document.getElementById('bu'+i); if(pu) pu.classList.add('on');
    if(marcar){ const m=document.getElementById('bm'+i); if(m) m.classList.add('on'); }
    i++;
    setTimeout(()=>{ if(dan) dan.className='badan'; setTimeout(paso,170); }, 470);
  };
  paso();
}
function baMostrar(){
  if(!baState || baState.playing || baState.n.libre) return;
  baState.playing=true;
  baBailar(baState.n.seq, true, ()=>{
    baState.playing=false;
    /* la consigna es una imagen: cuando termina la demostración, la flecha
       apunta a los botones. Nunca hay una frase que haya que leer. */
    const m=document.getElementById('bamsg'); if(m) m.innerHTML='👇';
  });
}
function baRun(){
  const {n,prog}=baState;
  if(baState.playing || !prog.length) return;
  baState.playing=true; baState.intentos++;
  const st=baState;
  baBailar(prog, false, ()=>{
    if(baState!==st) return;   // cambió de nivel mientras bailaba
    baState.playing=false;
    if(n.libre){
      sonarOk();
      const m=document.getElementById('bamsg'); if(m) m.innerHTML='🎉 💃 👏';
      if(!baState.guardado){
        baState.guardado=true;
        guardarVisual('baile','El baile','Secuencia libre','Mi baile',1,
                      Math.round((Date.now()-baState.t0)/1000));
      }
      return;
    }
    baFin(prog.length===n.seq.length && prog.every((p,i)=>p===n.seq[i]));
  });
}
function baFin(ok){
  const {idx}=baState;
  const msg=document.getElementById('bamsg');
  if(ok){
    sonarOk();
    guardarVisual('baile','El baile','Secuencia de pasos','Coreografía '+(idx+1),
                  baState.intentos, Math.round((Date.now()-baState.t0)/1000));
    if(msg) msg.innerHTML = baState.usoRepe ? '🎉 🔁 👏' : '🎉 🌟 👏';
    const wrap=app.querySelector('.bawrap');
    if(wrap){
      const b=document.createElement('div'); b.className='jrbtns'; b.style.marginTop='14px';
      b.innerHTML = idx>=BAILES.length-1 ? `<button class="jrgo" onclick="menu()" aria-label="terminar">🏆</button>`
                                         : `<button class="jrgo" onclick="baInicio(${idx+1})" aria-label="seguir">➡️ 🎈</button>`;
      wrap.appendChild(b);
    }
  } else {
    sonarNo();
    /* no se borra lo que armó: se marca en rojo el primer paso que no va
       y la bailarina muestra de nuevo cómo era */
    const {prog,n}=baState; let k=0;
    while(k<prog.length && k<n.seq.length && prog[k]===n.seq[k]) k++;
    baState.mal=k; baRender('🤔 🔁');
    const st=baState;
    setTimeout(()=>{ if(baState===st && !baState.playing) baMostrar(); }, 1500);
  }
}

/* ==================== PONER CADA COSA EN SU LUGAR ====================
   Emparejar, rompecabezas y mapas: una sola mecánica con tres caras, para
   que la actividad cambie sin que cambie la forma de usarla.

   Se puede ARRASTRAR la pieza (que es para lo que sirve este tipo de
   ejercicio: coordinación óculo-manual) o TOCAR la pieza y después el
   lugar. Las dos formas hacen exactamente lo mismo. Sólo arrastrar dejaría
   afuera a quien tiene dificultad motriz fina, y además hay que poder
   hacerlo sin arrastrar (WCAG 2.5.7).

   El lugar muestra siempre el dibujo en gris: la consigna es esa, no hay
   nada que leer. Con el interruptor Aa aparecen además las palabras.

   PARA AGREGAR NIVELES: sumá una entrada a PONER. 'par' y 'puz' son
   grillas; 'mapa' pone los lugares encima del dibujo de Argentina, en
   porcentaje de ancho y alto. Los nombres para la voz van en PO_NOM.
   ==================================================================== */
const PO_NOM={'🐶':'perro','🐱':'gato','🐰':'conejo','🐦':'pájaro',

const PONER=[
 {tipo:'par', cols:3, items:['🐶','🐱','🐰']},

 /* Argentina: cada cosa donde va. El dibujo es esquemático a propósito
    (se reconoce la forma, no sirve para medir). */
 {tipo:'mapa', items:[
   {id:'🌵', x:30, y:13}, {id:'🌴', x:73, y:16}, {id:'⛰️', x:22, y:42},
   {id:'🐄', x:60, y:44}, {id:'🐧', x:41, y:80}, {id:'🐟', x:83, y:62}]}
];
const MAPA_AR=`<svg viewBox="0 0 100 200" aria-hidden="true">
  <polygon fill="rgba(111,198,201,.13)" stroke="rgba(111,198,201,.55)" stroke-width="1.4"
   stroke-linejoin="round" points="30,3 48,1 58,7 62,13 76,15 88,22 84,31 74,34 78,42 76,53
   80,64 74,73 76,82 68,89 66,99 62,110 60,120 56,130 54,140 50,150 46,161 44,171 48,180
   40,184 34,178 36,168 32,156 30,143 28,130 26,117 24,102 22,88 20,73 18,58 20,44 24,29 26,15"/>
</svg>`;
let poState;
function poMezclar(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function poIds(n){ return n.tipo==='mapa' ? n.items.map(o=>o.id) : n.items; }
function poInicio(idx){
  cur=null;
  const n=PONER[idx];
  poState={idx, n, puestas:{}, piezas:poMezclar(poIds(n)), sel:null,
           intentos:0, t0:Date.now()};
  poRender();
}
function poCelda(id, extra){
  const puesta=!!poState.puestas[id];
  const pal=PALAB&&PO_NOM[id]?`<span class="bapal">${PO_NOM[id]}</span>`:'';
  return `<button class="pocelda ${puesta?'lista':''}" ${extra||''}
    aria-label="lugar de ${PO_NOM[id]||''}"
    onclick="poColocar(poState.sel,'${id}')"
    ondragover="event.preventDefault()"
    ondragenter="this.classList.add('sobre')"
    ondragleave="this.classList.remove('sobre')"
    ondrop="poSoltar(event,'${id}')"
    ><span class="${puesta?'':'gh'}">${id}</span>${pal}</button>`;
}
function poRender(msg){
  const n=poState.n, ids=poIds(n);
  const dots=puntosNivel(PONER.length, poState.idx, 'poInicio');
  let tablero;
  if(n.tipo==='mapa'){
    tablero=`<div class="pomapa">${MAPA_AR}${n.items.map(o=>
      poCelda(o.id,`style="left:${o.x}%;top:${o.y}%"`)).join('')}</div>`;
  }else{
    tablero=`<div class="pogrid" style="grid-template-columns:repeat(${n.cols},112px)">${
      ids.map(id=>poCelda(id)).join('')}</div>`;
  }
  const piezas=poState.piezas.map(id=>`<button class="popieza ${poState.sel===id?'sel':''}"
     draggable="true" ondragstart="poAgarrar(event,'${id}')"
     onclick="poTocar('${id}')" aria-label="${PO_NOM[id]||'pieza'}">${id}</button>`).join('');

    <div class="topbar"><button class="backb" onclick="menu()" aria-label="volver">←</button>
      <div class="progtext" style="letter-spacing:3px;color:var(--b1)">${dots}</div>
      <div class="baopts">${btnsAyuda(true)}</div></div>
    <div class="card powrap">
     <div class="jrcols">

        <div class="popiezas">${piezas||'<span style="opacity:.3;font-size:2rem">✔️</span>'}</div>
      </div>
     </div>
    </div>`;
}
function poTocar(id){
  poState.sel = (poState.sel===id ? null : id);
  if(poState.sel){ tono(659.25,.2); decir(PO_NOM[id]); }
  poRender();
}
function poAgarrar(ev,id){
  poState.sel=id;
  try{ ev.dataTransfer.setData('text/plain',id); ev.dataTransfer.effectAllowed='move'; }catch(e){}
}
function poSoltar(ev,slot){
  ev.preventDefault();
  let id=''; try{ id=ev.dataTransfer.getData('text/plain'); }catch(e){}
  poColocar(id||poState.sel, slot);
}
function poColocar(pieza, slot){
  if(!poState || !pieza || poState.puestas[slot]) return;
  poState.intentos++;
  if(pieza===slot){
    poState.puestas[slot]=true;
    poState.piezas=poState.piezas.filter(p=>p!==pieza);
    poState.sel=null;
    tono(783.99,.26);
    poRender();
    if(!poState.piezas.length) poFin();
  }else{
    sonarNo(); poState.sel=null; poRender('🤔 🔁');
  }
}
function poFin(){
  const idx=poState.idx;
  sonarOk();
  guardarVisual('poner','Poner en su lugar','Emparejar y ubicar','Tablero '+(idx+1),
                Math.max(1, poState.intentos - poIds(poState.n).length + 1),
                Math.round((Date.now()-poState.t0)/1000));
  const msg=app.querySelector('.jrmsg'); if(msg) msg.innerHTML='🎉 🌟 👏';
  const col=app.querySelector('.popiezas');
  if(col){
    const b=document.createElement('div'); b.className='jrbtns'; b.style.marginTop='18px';
    b.innerHTML = idx>=PONER.length-1 ? `<button class="jrgo" onclick="menu()" aria-label="terminar">🏆</button>`
                                      : `<button class="jrgo" onclick="poInicio(${idx+1})" aria-label="seguir">➡️ 🎈</button>`;
    col.parentNode.appendChild(b);
  }
}

function geInicio(idx){
  cur=null;
  const m=GEOMAPAS[idx];
  geState={idx, m, puestas:{}, piezas:poMezclar(m.lugares.map(l=>l.id)),
           sel:null, intentos:0, t0:Date.now()};
  geRender();
}
function geLugar(id){ return geState.m.lugares.find(l=>l.id===id); }
function geRender(msg){
  const m=geState.m, H=m.h;
  const dots=puntosNivel(GEOMAPAS.length, geState.idx, 'geInicio');
  /* el fondo no es objetivo: está para dar contexto y para poder tocarlo
     y escuchar cómo se llama */
  const fondo=m.fondo.map((f,i)=>`<path class="gefondo" d="${f.d}"
      onclick="geErrar(${i})" ondragover="event.preventDefault()"
      ondrop="geSoltarFondo(event,${i})"></path>`).join('');
  const formas = m.tipo!=='forma' ? '' : m.lugares.map(l=>
    `<path class="geslot ${geState.puestas[l.id]?'lista':''}" d="${l.d}"
      tabindex="0" role="button" aria-label="lugar de ${l.nom}"
      onclick="geColocar(geState.sel,'${l.id}')" onkeydown="geTecla(event,'${l.id}')"
      ondragover="event.preventDefault()" ondragenter="this.classList.add('sobre')"
      ondragleave="this.classList.remove('sobre')"
      ondrop="geSoltar(event,'${l.id}')"></path>`).join('');
  const puntos = m.tipo!=='punto' ? '' : m.lugares.map(l=>{
    const ok=!!geState.puestas[l.id];
    return `<button class="pocelda ${ok?'lista':''}" style="left:${l.x}%;top:${l.y}%"
      aria-label="lugar de ${l.nom}" onclick="geColocar(geState.sel,'${l.id}')"
      ondragover="event.preventDefault()" ondragenter="this.classList.add('sobre')"
      ondragleave="this.classList.remove('sobre')" ondrop="geSoltar(event,'${l.id}')"
      ><span class="${ok?'':'gh'}">${l.ic}</span></button>`;
  }).join('');
  /* el cartel con el nombre aparece recién cuando la pieza está bien puesta */
  const carteles=m.lugares.filter(l=>geState.puestas[l.id]).map(l=>
    `<span class="gecartel ${m.tipo==='punto'?'pto':''} ${l.arr?'arr':''}"
      style="left:${l.x}%;top:${l.y}%${l.lx?';margin-left:'+l.lx+'px':''}"
      >${m.tipo==='punto'?'':l.ic}<b>${l.nom}</b></span>`).join('');
  const piezas=geState.piezas.map(id=>{
    const l=geLugar(id);
    return `<button class="gepieza ${geState.sel===id?'sel':''}" draggable="true"
      ondragstart="geAgarrar(event,'${id}')" onclick="geTocar('${id}')"
      aria-label="${l.nom}">${l.bb
        ? `<svg class="gesil" viewBox="${l.bb}" preserveAspectRatio="xMidYMid meet"
             aria-hidden="true"><path d="${l.d}"/></svg>`
        : `<span class="geic">${l.ic}</span>`}<span class="genom">${
          l.bb?l.ic+' ':''}${l.nom}</span></button>`;
  }).join('');
  app.innerHTML=`
    <div class="topbar"><button class="backb" onclick="menu()" aria-label="volver">←</button>
      <div class="progtext" style="letter-spacing:3px;color:var(--b1)">${dots}</div>
      <div class="baopts">${btnsAyuda(false)}</div></div>
    <div class="card gewrap">
     <div class="jrcols">
      <div class="gemapa" style="--ar:${(100/H).toFixed(3)}">
        <svg viewBox="0 0 100 ${H}">${fondo}${formas}</svg>
        ${puntos}${carteles}
      </div>
      <div>
        <div class="jrmsg" role="status" aria-live="polite">${msg||''}</div>
        <div class="gepiezas">${piezas||'<span style="opacity:.3;font-size:2rem">✔️</span>'}</div>
      </div>
     </div>
    </div>`;
}
function geTocar(id){
  geState.sel = (geState.sel===id ? null : id);
  if(geState.sel){ tono(659.25,.2); decir(geLugar(id).nom); }
  geRender();
}
function geAgarrar(ev,id){
  geState.sel=id;
  try{ ev.dataTransfer.setData('text/plain',id); ev.dataTransfer.effectAllowed='move'; }catch(e){}
}
function geSoltar(ev,slot){
  ev.preventDefault();
  let id=''; try{ id=ev.dataTransfer.getData('text/plain'); }catch(e){}
  geColocar(id||geState.sel, slot);
}
function geSoltarFondo(ev,i){ ev.preventDefault(); geErrar(i); }
function geTecla(ev,slot){
  if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); geColocar(geState.sel,slot); }
}
/* tocar el fondo: si no hay pieza agarrada, sólo dice el nombre (explorar);
   si había una, es un error como cualquier otro */
function geErrar(i){
  const f=geState.m.fondo[i];
  if(!geState.sel){ if(f&&f.nom) decir(f.nom); return; }
  geState.intentos++; sonarNo(); geState.sel=null;
  geRender('🤔 🔁');
  if(f&&f.nom) setTimeout(()=>decir(f.nom), 260);
}
function geColocar(pieza, slot){
  if(!geState || !pieza || geState.puestas[slot]) return;
  geState.intentos++;
  if(pieza===slot){
    geState.puestas[slot]=true;
    geState.piezas=geState.piezas.filter(p=>p!==pieza);
    geState.sel=null;
    tono(783.99,.26); decir(geLugar(slot).nom);
    geRender();
    if(!geState.piezas.length) geFin();
  }else{
    sonarNo(); geState.sel=null; geRender('🤔 🔁');
  }
}
function geFin(){
  const idx=geState.idx;
  sonarOk();
  guardarVisual('mapa','El mapa','Dónde queda cada cosa', geState.m.nom,
                Math.max(1, geState.intentos - geState.m.lugares.length + 1),
                Math.round((Date.now()-geState.t0)/1000));
  const msg=app.querySelector('.jrmsg'); if(msg) msg.innerHTML='🎉 🌟 👏';
  const col=app.querySelector('.gepiezas');
  if(col){
    const b=document.createElement('div'); b.className='jrbtns'; b.style.marginTop='18px';
    b.innerHTML = idx>=GEOMAPAS.length-1
      ? `<button class="jrgo" onclick="menu()" aria-label="terminar">🏆</button>`
      : `<button class="jrgo" onclick="geInicio(${idx+1})" aria-label="seguir">➡️ 🎈</button>`;
    col.parentNode.appendChild(b);
  }
}

  base:`const int SENSOR = A0;

}

void loop() {
  // 1. lee el sensor

}`,
  pistas:[
   'La recta es <code>humedad = m * crudo + b</code>, con la <code>m</code> y la <code>b</code> que sacó <b>tu equipo</b> al calibrar. Tienen decimales, así que la variable va <code>float</code>.',
   'Para que la línea sea un CSV de verdad: <code>Serial.print(...)</code> para cada valor, <code>Serial.print(",")</code> entre uno y otro, y <code>Serial.println(...)</code> en el último, que es el que baja de renglón. <b>Comas sin espacios</b>, y el decimal con punto.',

 comp:[
  {k:'Componentes', t:'Un hongo no quiere lo mismo que una planta', h:`
    <p>Una planta quiere <b>agua en la tierra</b>. Un hongo quiere <b>agua en el aire</b>: entre
    <b>80 y 90 % de humedad relativa</b>. Si baja, los primordios —los hongos chiquitos que
    recién asoman— se secan y no crecen más.</p>
    <p>También quiere <b>temperatura estable</b>, alrededor de 18 a 24 °C para las gírgolas, y
    <b>aire fresco</b>: el hongo respira y suelta CO₂. Si el CO₂ se acumula, salen deformes —
    pie largo y sombrero chico.</p>
    <div class="hint"><b>El sensor de humedad de suelo que usa el riego no sirve acá.</b> Mide
    agua en la tierra, y esto necesita medir agua en el aire. Son dos magnitudes distintas con
    el mismo nombre, y confundirlas es el error clásico.</div>`},
  {k:'Componentes', t:'El sensor de humedad del aire', h:`
    <p>El <b>DHT22</b> (o el BME280) mide <b>humedad relativa en % y temperatura en grados</b>,
    y los devuelve <b>ya convertidos</b>. No entrega un número de 0 a 1023: habla por un
    protocolo y contesta valores hechos.</p>
    <p><b>Y ahí está la diferencia grande con el riego:</b> en el riego hay que construir la
    recta midiendo. Acá <b>la recta la trae el fabricante</b>, hecha de antes. Vale la pregunta:
    <i>¿por qué le creemos al fabricante y no a nosotros mismos?</i></p>
    <div class="hint"><b>Para simular hoy:</b> el DHT necesita una librería y en Tinkercad no se
    pueden instalar librerías. Buscá <code>DHT</code> en el panel de componentes por las dudas;
    si no está, <b>una perilla en A0 hace de higrómetro</b> y el <b>TMP36 en A1</b> de
    termómetro. El programa se escribe igual: <b>cambia el sensor, no la estructura</b>.</div>`},
  {k:'Componentes', t:'Dos salidas que se pelean', h:`
    <p>Van dos actuadores: un <b>humidificador</b> (un nebulizador, por relé) y un
    <b>ventilador</b> para renovar el aire.</p>
    <p><b>Y acá aparece algo que los otros proyectos no tienen:</b> ventilar renueva el aire y
    saca el CO₂, pero <b>también se lleva la humedad</b>. Humidificar y ventilar
    <b>se contradicen</b>.</p>
    <p>Por eso no alcanza con dos <code>si</code> sueltos. Hay que decidir <b>cuál gana</b>
    cuando los dos se piden a la vez: ventilar poco y seguido, alternar, o dar prioridad a uno.
    <b>Esa regla la inventan ustedes y es lo más interesante del proyecto.</b></p>
    <div class="hint">Es la primera vez en el año que un aparato tiene dos salidas que no pueden
    estar prendidas al mismo tiempo. Un sistema que no resuelve eso hace las dos cosas y no
    consigue ninguna.</div>`},
  {k:'Componentes', t:'Por qué hongos, y por qué acá', h:`
    <p><b>Es un ambiente cerrado.</b> A diferencia de la huerta, que está a la intemperie y donde
    el clima manda, un cultivo de hongos entra en una caja o en un cuarto chico: lo que el
    aparato hace <b>se nota</b>.</p>
    <p><b>El ciclo es corto.</b> En semanas hay resultado. La huerta tarda meses.</p>
    <p>Y es un <b>producto</b>: un cultivo que funciona tiene algo para mostrar y para vender en
    el Paseo Don Jaime, con el aparato al lado explicando cómo se lo cuidó.</p>`}],

 cod:{
  consigna:'Escribí el programa que lee la humedad del aire y la temperatura, decide si hay que humidificar y si hay que ventilar, y <b>resuelve qué pasa cuando los dos se piden a la vez</b>.',

   {t:'Que la placa dé señales de vida',

  base:`const int HUM  = A0;   // por ahora la perilla; despues el sensor real
const int TMP  = A1;   // TMP36
const int NEBU = 7;    // rele del humidificador
const int VENT = 6;    // ventilador
const int LED  = 13;   // testigo

float humedad, temp;

void setup() {
  pinMode(NEBU, OUTPUT);
  pinMode(VENT, OUTPUT);
  pinMode(LED, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  // 1. lee la humedad y convertila a 0-100 %

  // 2. lee el TMP36 y convertilo a grados

  // 3. guarda las dos decisiones en variables con nombre

  // 4. resolve el conflicto: cual gana si los dos se piden

  delay(1000);
}`,
  pistas:[
   'La perilla da 0 a 1023 y hay que pasarla a porcentaje: <code>humedad = map(analogRead(HUM), 0, 1023, 0, 100);</code>. Es la misma función lineal de siempre. El TMP36 tiene su propia recta, la del fabricante: <code>float v = analogRead(TMP) * 5.0 / 1024.0;</code> y después <code>temp = (v - 0.5) * 100.0;</code>',
   'Antes de actuar, <b>guardá cada decisión en una variable con nombre</b>: <code>bool falta_agua = (humedad &lt; 80);</code> y <code>bool hace_calor = (temp &gt; 24);</code>. El programa se lee solo, y después las podés combinar sin enredarte.',
   'El conflicto se resuelve con <b>prioridad</b>: poné primero el <code>if</code> del que gana, y adentro <b>apagá al otro</b>. Lo que elijan es su regla, pero tiene que quedar escrita.'],
  sol:`  humedad = map(analogRead(HUM), 0, 1023, 0, 100);
  float v = analogRead(TMP) * 5.0 / 1024.0;
  temp = (v - 0.5) * 100.0;

  Serial.print(humedad); Serial.print(" %   ");
  Serial.println(temp);

  bool falta_agua = (humedad < 80);
  bool hace_calor = (temp > 24);

  if (hace_calor) {                 // ventilar tiene prioridad
    digitalWrite(VENT, HIGH);
    digitalWrite(NEBU, LOW);        // no humidifica mientras ventila
  } else {
    digitalWrite(VENT, LOW);
    if (falta_agua) digitalWrite(NEBU, HIGH);
    else            digitalWrite(NEBU, LOW);
  }

  if (falta_agua || hace_calor) digitalWrite(LED, HIGH);
  else                          digitalWrite(LED, LOW);`}
},

  base:`float temp, luz;
float anterior = 99;      // la última temperatura, para saber si baja

void setup() {
  pinMode(13, OUTPUT);
  Serial.begin(9600);
  Serial.println("temp_c,luz_cruda");    // el encabezado, una sola vez
}

void loop() {
  // 1. leé la temperatura y la luz

  // 2. escribí la fila: los valores separados por coma

  // 3. si hace frío Y bajó respecto de la anterior, prendé la alerta

  // 4. guardá esta temperatura para la próxima vuelta

  delay(5000);
}`,
  pistas:[
   'La fila se escribe con <code>Serial.print(temp); Serial.print(","); Serial.println(luz);</code>. El <code>println</code> del final es el que corta el renglón: <b>cada renglón es una fila</b>.',
   'La alerta necesita las dos cosas a la vez, así que va con <code>&&</code>: <code>if (temp &lt; 3 && temp &lt; anterior)</code>.',
   'El paso 4 es el que casi todos olvidan: <code>anterior = temp;</code> al final del loop. Sin eso, <code>anterior</code> se queda en 99 para siempre y la alerta nunca entiende que bajó. Y fijate que <code>anterior</code> está declarada <b>afuera</b> del loop: si estuviera adentro, se borraría en cada vuelta.'],
  sol:`  temp = (analogRead(A0) * 5.0 / 1024.0 - 0.5) * 100.0;
  luz  = analogRead(A1);

  Serial.print(temp);
  Serial.print(",");
  Serial.println(luz);

  if (temp < 3 && temp < anterior) {
    digitalWrite(13, HIGH);
  } else {
    digitalWrite(13, LOW);
  }

  anterior = temp;`}

  sol:`void setup() {
  pinMode(13, OUTPUT);
  Serial.begin(9600);
  Serial.println("momento,temp_C,luz");
}

void loop() {
  digitalWrite(13, HIGH);

  int crudo = analogRead(A0);
  Serial.print(millis()); Serial.print(",");

  if (crudo < 5 || crudo > 1018) {
    Serial.print("NA");
  } else {
    float v = crudo * 5.0 / 1024.0;
    Serial.print((v - 0.5) * 100.0, 1);
  }

  Serial.print(",");
  Serial.println(analogRead(A1));

  delay(50);
  digitalWrite(13, LOW);
  delay(600000);      // 10 minutos
}`}

  t+=`Equipo: ${SES?SES.nombre:'(sin nombre)'}\nQué decide: ${txtPlano(p.que)}\n\n`;

function proyEjPista(k){

}
function proyPista(i,k){
  const h=document.getElementById('ph'+k), b=document.getElementById('pb'+k);
  if(h){ h.hidden=false; } if(b){ b.hidden=true; }
  tono(523.25,.18);
}

      <div class="hint" style="margin-top:10px"><b>Por qué la presión y no la altura.</b> No
      existe un sensor de altura. Existe uno de presión, y la presión <b>baja</b> a medida que
      uno sube: más o menos <b>1 hPa cada 9 metros</b>. La altura no se mide: se calcula. Esa
      cuenta es la misma máquina de traducir de la misión 2.</div>
    </div>

    <div class="card"><div class="concepto">Y del otro lado: los actuadores</div>
      <p style="margin:6px 0 10px;line-height:1.7">Es lo que el aparato <b>hace</b> una vez que
      decidió. El sensor se entera; el actuador actúa.</p>
      <table class="esqt">
        <tr><th>Pieza</th><th>Qué hace</th></tr>
        <tr><td><b>LED</b></td><td>Avisa con luz. En el registrador se usa de <b>testigo</b>: prendido significa «estoy grabando»</td></tr>
        <tr><td><b>Buzzer</b></td><td>Avisa con sonido, y sirve de noche cuando nadie está mirando</td></tr>
        <tr><td><b>Pantalla LCD</b></td><td>Muestra el número a quien esté parado al lado</td></tr>
        <tr><td><b>Tarjeta microSD</b></td><td>No actúa: <b>recuerda</b>. Es lo que convierte al aparato en un registrador</td></tr>
      </table>
    </div>

    <div class="card"><div class="concepto">🚀 Qué lleva el cohete</div>
      <table class="esqt">
        <tr><th>Pieza</th><th>Para qué sirve en el vuelo</th></tr>
        <tr><td><b>Arduino Nano</b></td><td>El cerebro. El Nano y no el Uno porque es chiquito y pesa poco</td></tr>
        <tr><td><b>Acelerómetro-giroscopio</b><br><span class="mono">MPU6050</span></td>
            <td>Cuánto lo empujan y para dónde apunta. Se ve el despegue (10 a 20 g), el vuelo sin motor (0 g) y el golpe</td></tr>
        <tr><td><b>Sensor de presión y temperatura</b><br><span class="mono">BMP280</span></td>
            <td>La presión baja cuando el cohete sube: <b>de ahí sale la altura</b></td></tr>
        <tr><td><b>Tarjeta microSD</b></td><td>Donde queda el archivo. Sin esto no hay nada para graficar</td></tr>
        <tr><td><b>LED testigo</b></td><td>Prendido quiere decir «estoy grabando». Se mira antes de lanzar</td></tr>
        <tr><td><b>Pilas</b></td><td>En el aire no hay cable USB</td></tr>
      </table>
      <p style="margin:10px 0 0;line-height:1.7"><b>Y lo que sale al final: el recorrido del cohete,
      dibujado.</b> Con el archivo se grafica la presión contra el tiempo y aparece una V: el fondo
      de la V es el punto más alto. La temperatura también se grafica, pero en seis segundos casi no
      se mueve — y está bien. El sensor la necesita para corregir la presión.</p>
      <div class="hint" style="margin-top:10px"><b>BMP280 o BME280.</b> Son hermanos y por fuera
      no se distinguen. El <b>BMP280</b> mide presión y temperatura, que es todo lo que necesita el
      cohete. El <b>BME280</b> además mide humedad, que le sirve a la estación. Los dos andan en el
      cohete, pero en el código cambian dos líneas —la librería y el tipo de sensor—, así que hay
      que saber cuál tienen en la mano.</div>
    </div>

    <div class="card"><div class="concepto">El cohete y la estación: casi el mismo circuito</div>
      <p style="margin:6px 0 0;line-height:1.7">Esto sorprende y conviene saberlo de entrada:
      <b>no son dos circuitos distintos</b>. Los dos llevan la misma placa, el mismo sensor de
      presión y temperatura, el mismo módulo de tarjeta y el mismo LED testigo. <b>El cohete suma
      una sola pieza</b>, el acelerómetro-giroscopio, y va a los mismos dos cables que el sensor
      de presión.</p>
      <p style="margin:12px 0 0;line-height:1.7"><b>Lo único que cambia está en el código:</b> la
      estación espera diez minutos entre medición y medición y cierra el archivo cada vez; el
      cohete no espera casi nada y lo deja abierto, porque no le sobra tiempo. Y en el cohete
      además hay que sujetar todo con espuma y alimentarlo con pilas, porque no va a haber un
      cable USB en el aire.</p>
      <div class="hint" style="margin-top:10px">El esquema pin por pin está en las fichas:
      <b>El esquema de conexión</b>. Y el orden para armarlo sin volverse loco es el de la misión
      1: primero el LED solo, después el botón, después el sensor. <b>Cada paso tiene que andar
      antes de pasar al siguiente</b>, o no se sabe nunca cuál de los cinco cables está mal.</div>
    </div>

    <button class="btn" onclick="cuadHome()">Volver a las misiones →</button>
    <button class="btn ghost" onclick="cuadFichas()">📖 Ver las fichas de consulta</button>`;
  window.scrollTo(0,0);
}

/* ---- guardado, sin repintar la pantalla ---- */
function cuadChk(n,i,el){
  const d=cuadLee(), e=cuadE(d,n); e.chk[i]=!e.chk[i]; cuadSave(d);
  el.classList.toggle('on', !!e.chk[i]);
  const bx=el.querySelector('.cbox'); if(bx) bx.textContent=e.chk[i]?'✓':'';
  const pr=document.getElementById('cprog'); if(pr){ const p=cuadProg(n); pr.textContent=p.c+' de '+p.t; }
  tono(e.chk[i]?659.25:392,.12);
}
function cuadDec(n,k,j,el){
  const d=cuadLee(), e=cuadE(d,n);
  e.dec[k]=Object.assign({por:''}, e.dec[k], {op:j}); cuadSave(d);
  const w=el.parentNode; for(let i=0;i<w.children.length;i++) w.children[i].classList.toggle('on', i===j);
  tono(659.25,.15);
}
function cuadPor(n,k,v){ const d=cuadLee(), e=cuadE(d,n);
  e.dec[k]=Object.assign({op:null}, e.dec[k], {por:v}); cuadSave(d); }
function cuadCampo(n,id,v){ const d=cuadLee(), e=cuadE(d,n); e.campos[id]=v; cuadSave(d); }
function cuadBit(n,v){ const d=cuadLee(), e=cuadE(d,n); e.bit=v; cuadSave(d); }

/* ---- copiar para la profe ---- */
function cuadTexto(n){
  const et=ETAPAS3[n-1], dd_=cuadLee(), e=dd_.e[n]||{chk:{},dec:{},campos:{},bit:''}, coh=dd_.tipo==='coh';
  let t='MISIÓN '+n+' · '+(et.cod||'')+' — '+et.tit+' ('+et.fecha+')\n';
  (et.campos||[]).forEach(function(c){
    t+='  '+txtPlano((coh&&c.qcoh)?c.qcoh:c.q)+'\n    '+((e.campos||{})[c.id]||'(sin contestar)')+'\n'; });
  (et.dec||[]).forEach(function(dd,k){ const m=(e.dec||{})[k];
    t+='  '+txtPlano(dd.q)+'\n    Elegimos: '+(m&&m.op!=null?txtPlano(dd.op[m.op]):'(sin elegir)')
     +'\n    Porque: '+((m&&m.por)||'(sin justificar)')+'\n'; });
  let c=0; et.listo.forEach(function(x,i){ if((e.chk||{})[i]) c++; });
  t+='  Checklist: '+c+' de '+et.listo.length+'\n';
  et.listo.forEach(function(x,i){ t+='    ['+((e.chk||{})[i]?'x':' ')+'] '+txtPlano(x)+'\n'; });
  t+='  Bitácora: '+(e.bit||'(vacía)')+'\n';
  return t;
}
function cuadCopiar(n){
  const d=cuadLee();
  let t='CUADERNO DEL PROYECTO — 3ro\n';
  t+='Grupo: '+(SES?SES.nombre:'(sin nombre)')+'\n';
  t+='Proyecto: '+(d.tipo==='coh'?'El cohete':(d.tipo==='est'?'La estación':'(sin elegir)'))+'\n\n';
  if(n) t+=cuadTexto(n);
  else for(let i=1;i<=ETAPAS3.length;i++) t+=cuadTexto(i)+'\n';
  const box=document.getElementById('ccopia');
  if(box) box.innerHTML='<textarea class="f" rows="10" onclick="this.select()">'+escapeHtml(t)
    +'</textarea><div class="muted" style="font-size:.85rem">Tocá el cuadro para seleccionar todo y pegalo en el Classroom.</div>';
}

/* ---- pantalla de inicio de los juegos ---- */
function juegoHome(){
  cur=null;
  const bolas=d=>'●'.repeat(d)+'○'.repeat(5-d);
  const tarjeta=(j,i)=>`
    <button class="item wide${j.dif>=4?' dest':''}" onclick="juegoVer(${i})">
      <div class="n">${j.ic} ${j.nom}</div>
      <div class="d">${j.que}.</div>
      <div class="foot"><span class="lvl">${bolas(j.dif)}</span>
        <span class="hecho">${j.blo}</span></div>
    </button>`;
  const primeros=JUEGOS.map((j,i)=>j.todos?tarjeta(j,i):'').join('');
  const resto=JUEGOS.map((j,i)=>j.todos?'':tarjeta(j,i)).join('');
  app.innerHTML=`
    <div class="topbar"><button class="backb" onclick="menu()" aria-label="volver">← Menú</button></div>
    <div class="card">
      <div class="concepto big">Los juegos</div>
      <h2 style="margin-top:0">Un circuito, ocho juegos</h2>
      <p style="margin:0;line-height:1.7">Se arma <b>una sola vez</b>: 4 luces, 4 botones y

      <div class="hint" style="margin-top:10px">Acá <b>no está el programa hecho</b>. Están
      los pasos con huecos y pistas que se abren de a una.<br><b>Pensarlo es la parte
      divertida.</b></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr">
      <button class="item wide" onclick="verSlides(TINKERB,'juegoHome()','Ver los juegos →',juegoHome)">
        <div class="n">🔧 Antes de empezar</div>
        <div class="d">Cómo entrar a Tinkercad, cómo se arma el circuito y dónde están los bloques.</div>
      </button>
    </div>
    <div class="grid" style="grid-template-columns:1fr">
      <button class="item wide dest" onclick="startSala('jue')">
        <div class="n">✏️ Practicá: programá los juegos</div>
        <div class="d">Los pasos de cada juego, el bloque que falta y el error escondido. Se corrige solo.</div></button>
      <button class="item wide dest" onclick="startSala('juem')">
        <div class="n">🔢 Practicá: las cuentas de los juegos</div>
        <div class="d">Negativos, potencias, el resto de la división, promedios y la jerarquía de las operaciones.</div></button>

/* -------------------- FIN DE SALA -------------------- */
function finSala(){
  const total=cur.ejs.length, pts=cur.puntos;
  const sinAyuda = cur.reg.filter(r=>r.ok1).length;
  const ratio = sinAyuda/total;
  const cuenta = cur.modo==='desafio';
  let med,msg;
  if(ratio===1){ med='Impecable'; msg='Te salieron todas de una, sin ayuda. Eso es entenderlo.'; }
  else if(ratio>=0.7){ med='Muy bien'; msg='Casi todas de una. Mirá las que necesitaron una segunda vuelta.'; }
  else if(ratio>=0.4){ med='Vas bien, falta afinar'; msg=cuenta?'Repasá los conceptos que fallaron y volvé a probar.':'Varias las sacaste recién después de leer la explicación. Volvé a hacer la sala y fijate cuántas te salen de una.'; }
  else { med='A repasar'; msg=cuenta?'Este tema hay que volver a verlo.':'Practicar está bien, pero todavía no te sale solo. Repasá y volvé a intentar la sala completa.'; }

  const guardado = guardarTanda(sinAyuda);
  const esUni = cur.sala._uni!==undefined;
  const ult = DB.load().slice(-1)[0];
  _ultimoCodigo = (guardado && ult) ? codigoDeTanda(ult) : '';
  if(ult) enviarPendientes();   // manda esta y las que hayan quedado colgadas
  app.innerHTML = `<div class="card final">
      <div class="med">${med}</div>
      ${cuenta ? `<div style="font-size:2.2rem;font-weight:800;color:var(--warn)">${sinAyuda} / ${total}</div>
        <div class="sub" style="margin-top:6px">Ronda que cuenta · un intento por ejercicio</div>`
      : `<div class="dosnum">
          <div><div class="v">${pts} / ${total}</div><div class="k">Practicaste<br>(con ayudas y reintentos)</div></div>
          <div class="real"><div class="v">${sinAyuda} / ${total}</div><div class="k">Te salió sin ayuda<br>a la primera</div></div>
        </div>`}
      <div class="sub">${msg}</div>
      ${guardado?'':'<div class="sub" style="color:var(--warn);font-size:.8rem">No se pudo guardar el resultado en esta máquina.</div>'}
      ${_ultimoCodigo?`<button class="btn" id="cpBtn" onclick="copiarResultado()">Copiar mi resultado para la profe</button>
        <div id="cpBox"></div>`:''}
      <button class="btn ghost" onclick="${esUni?`startUnidad(${cur.sala._uni},'${cur.sala.id.endsWith('-int')?'int':'ej'}')`:`startSala('${cur.sala.id}')`}">Reintentar</button>
      <button class="btn ghost" onclick="${esUni?`verUnidad(${cur.sala._uni})`:'menu()'}">${esUni?'← Volver a la unidad':'← Volver a las salas'}</button>
    </div>`;
}

const CLAVE_DOCENTE = 'profe';        // ← cambiala acá si querés otra

/* URL del buzón en el Drive de la escuela (Apps Script).

const URL_BUZON = 'https://script.google.com/macros/s/AKfycbzLxvvU5Nw5Zx1yKyeb9z7WB1b2AQD8x7FcPpFznLSr3K8kImnVx4dNrX1Z0WntVigUjg/exec';

const LS={
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },

const DB={
  load(){ const d=LS.get(K_DAT,[]); return Array.isArray(d)?d:[]; },

/* Tres modos. Los tres registran igual; cambia cuanta ayuda dan.
     presenta → pistas, reintentos y explicacion en el momento. Para proyectar en clase.
     practica → pistas y reintentos, pero la explicacion recien aparece al resolverlo.
     desafio  → sin pistas, un intento, y explicacion solo si acerto. */
const MODOS = {
  presenta:{n:'Presentación', d:'Pistas, reintentos y la explicación en el momento. Se ve cuántos intentos llevás.'},
  practica:{n:'Práctica',     d:'Pistas y reintentos. La explicación aparece recién cuando lo resolvés.'},

/* el "hecho" del menú es el mejor SIN AYUDA, no el puntaje con ayudas */
function recalcDone(){
  Object.keys(done).forEach(k=>delete done[k]);

  DB.load().forEach(t=>{

}

/* ============================================================
   BUZÓN: envío automático a la planilla del Drive de la escuela
   ------------------------------------------------------------
   Cada tanda se manda apenas termina. Si no hay internet en ese
   momento queda pendiente y se reintenta al abrir la app o al
   terminar la siguiente, así no se pierde nada. El localStorage
   sigue siendo el respaldo local.
   ============================================================ */
function enviarTanda(t){
  if(!URL_BUZON || !t || t.enviada) return Promise.resolve(false);
  return fetch(URL_BUZON, {
      method:'POST', mode:'no-cors', cache:'no-store',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(t)
    })
    .then(()=>{ marcarEnviada(t.id); return true; })
    .catch(()=>false);          // sin red: queda pendiente
}
function marcarEnviada(id){
  const a=DB.load(); const t=a.find(x=>x.id===id);
  if(t && !t.enviada){ t.enviada=true; DB.save(a); }
}
function pendientes(){ return DB.load().filter(t=>!t.enviada); }
function enviarPendientes(){
  if(!URL_BUZON) return Promise.resolve(0);
  const p=pendientes();
  if(!p.length) return Promise.resolve(0);
  return Promise.all(p.map(enviarTanda)).then(r=>r.filter(Boolean).length);
}

/* ============================================================
   CÓDIGO DE RESULTADO
   El alumno copia un código al terminar y lo pega donde la docente
   le diga (Classroom, chat, un documento). La docente los pega
   todos juntos en el panel y arma la planilla, sin pasar por las
   máquinas. Es el camino que funciona sin servidor ni cuentas.
   ============================================================ */
function codigoDeTanda(t){
  /* la consigna completa se recorta: es lo que más pesa y en la planilla
     alcanza con el concepto para saber dónde falló */
  const min={i:t.id,a:t.alumno,y:t.anio,f:t.fecha,ts:t.ts,s:t.salaNom,q:t.sala,
    m:t.modo,n:t.total,r:t.resueltos,k:t.sinAyuda,p:t.pistas,x:t.salteadas,g:t.seg,
    e:(t.ejs||[]).map(e=>({c:e.c,t:e.t,q:String(e.q||'').slice(0,42),
      i:e.i,ok:e.ok,ok1:e.ok1,p:e.p,s:e.s,sg:e.sg}))};
  return 'PPS1.'+btoa(unescape(encodeURIComponent(JSON.stringify(min))));
}
function tandaDeCodigo(c){
  const m=String(c).trim().match(/PPS1\.([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!o || !o.a) return null;
    return {id:o.i||('p'+Math.random().toString(36).slice(2,10)), alumno:o.a, anio:o.y,
      fecha:o.f, ts:o.ts, sala:o.q||'?', salaNom:o.s, modo:o.m, total:o.n, resueltos:o.r,
      sinAyuda:o.k, pistas:o.p, salteadas:o.x, seg:o.g, ejs:Array.isArray(o.e)?o.e:[]};
  }catch(e){ return null; }
}
let _ultimoCodigo='';
function copiarResultado(){
  if(!_ultimoCodigo) return;
  const fin=()=>{ const b=document.getElementById('cpBtn'); if(b) b.textContent='Copiado ✓'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(_ultimoCodigo).then(fin, mostrarCodigo);
  } else mostrarCodigo();
}
function mostrarCodigo(){
  const c=document.getElementById('cpBox');
  if(c) c.innerHTML=`<p class="muted" style="font-size:.8rem;margin:12px 0 6px">
      Copiá todo este texto y pegalo donde te indique la profe:</p>
    <textarea class="f" rows="4" readonly onclick="this.select()"
      style="font-family:ui-monospace,monospace;font-size:.7rem">${escapeHtml(_ultimoCodigo)}</textarea>`;
}

/* -------------------- respaldo / consolidación -------------------- */
function bajar(blob,nombre){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 800);
}

  const d=DB.load();
  if(!d.length){ alert('No hay nada para respaldar en esta máquina.'); return; }
  bajar(new Blob([JSON.stringify({app:'practica-post-scratch', v:1, tandas:d})],{type:'application/json'}),
        `respaldo-practica-${hoyISO()}.json`);
}
function importarJson(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files && inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      let d; try{ d=JSON.parse(fr.result); }catch(e){ alert('Ese archivo no se pudo leer.'); return; }
      const nuevas = Array.isArray(d) ? d : (d && Array.isArray(d.tandas) ? d.tandas : null);
      if(!nuevas){ alert('Ese archivo no tiene resultados de esta app.'); return; }
      const act=DB.load(), vistos=new Set(act.map(t=>t.id));
      let n=0;
      nuevas.forEach(t=>{ if(t && t.id && !vistos.has(t.id)){ act.push(t); vistos.add(t.id); n++; } });
      if(!DB.save(act)){ alert('No se pudo guardar: la memoria del navegador está llena.'); return; }
      alert(n ? `Listo: se agregaron ${n} tanda(s).` : 'Ya estaban todas cargadas, no se duplicó nada.');
      panelDocente();
    };
    fr.readAsText(f);
  };
  inp.click();
}
function pegarCodigos(){
  const c=document.getElementById('pegarBox'); if(!c) return;
  c.innerHTML=`<p class="muted" style="font-size:.82rem;margin:16px 0 6px">
      Pegá acá todos los códigos juntos (uno por línea, o todos seguidos: se separan solos).</p>
    <textarea class="f" id="pegarTa" rows="6" placeholder="PPS1.eyJ..."
      style="font-family:ui-monospace,monospace;font-size:.72rem"></textarea>
    <div class="dbtns"><button class="dbtn pri" onclick="procesarCodigos()">Cargar</button>
      <button class="dbtn" onclick="document.getElementById('pegarBox').innerHTML=''">Cancelar</button></div>`;
  document.getElementById('pegarTa').focus();
}
function procesarCodigos(){
  const ta=document.getElementById('pegarTa'); if(!ta) return;
  const trozos=String(ta.value).match(/PPS1\.[A-Za-z0-9+/=]+/g) || [];
  if(!trozos.length){ alert('No encontré ningún código. Tienen que empezar con PPS1.'); return; }
  const act=DB.load(), vistos=new Set(act.map(t=>t.id));
  let n=0, rep=0, mal=0;
  trozos.forEach(c=>{
    const t=tandaDeCodigo(c);
    if(!t){ mal++; return; }
    if(vistos.has(t.id)){ rep++; return; }
    act.push(t); vistos.add(t.id); n++;
  });
  if(n && !DB.save(act)){ alert('No se pudo guardar: la memoria del navegador está llena.'); return; }
  alert(`Cargados: ${n}\nRepetidos (ya estaban): ${rep}${mal?`\nNo se pudieron leer: ${mal}`:''}`);
  panelDocente();
}
function borrarTodo(){
  if(prompt('Esto borra TODOS los resultados guardados en esta máquina.\nEscribí BORRAR para confirmar:')!=='BORRAR') return;
  DB.save([]); panelDocente();
}

/* ============================================================
   PLANILLA .xlsx — generada acá, sin librerías ni internet.
   Un .xlsx es un ZIP con XML adentro: lo armamos a mano.
   ============================================================ */
function crc32(buf){
  let t=crc32.t;
  if(!t){ t=crc32.t=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } }
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c=(c>>>8)^t[(c^buf[i])&0xFF];
  return (c^0xFFFFFFFF)>>>0;
}
function zipBlob(files){          // método "store": sin comprimir
  const parts=[], cen=[]; let off=0;
  const enc=new TextEncoder();
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data), sz=data.length;
    const lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,0,true); lv.setUint16(12,33,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,sz,true); lv.setUint32(22,sz,true);
    lv.setUint16(26,nb.length,true); lv.setUint16(28,0,true); lh.set(nb,30);
    parts.push(lh,data);
    const cd=new Uint8Array(46+nb.length), cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,33,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,sz,true); cv.setUint32(24,sz,true);
    cv.setUint16(28,nb.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true);
    cv.setUint32(42,off,true); cd.set(nb,46);
    cen.push(cd); off += lh.length + sz;
  });
  const cenSz=cen.reduce((a,c)=>a+c.length,0);
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cenSz,true); ev.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[eo]),
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xmlEsc(s){
  return String(s==null?'':s)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')   // caracteres de control: rompen el XML
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function colName(i){ let s=''; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
function xlDate(iso){
  const p=String(iso||'').split('-'); if(p.length!==3) return null;
  const d=Date.UTC(+p[0], +p[1]-1, +p[2]);
  return isNaN(d) ? null : Math.round(d/86400000)+25569;
}
const XL_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
 +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
 +'<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
 +'<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'
 +'<fills count="3"><fill><patternFill patternType="none"/></fill>'
 +'<fill><patternFill patternType="gray125"/></fill>'
 +'<fill><patternFill patternType="solid"><fgColor rgb="FF1F3B57"/><bgColor indexed="64"/></patternFill></fill></fills>'
 +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
 +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
 +'<cellXfs count="3">'
 +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
 +'<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'
 +'<xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
 +'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

function sheetXml(cols, rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
   +'<sheetViews><sheetView workbookViewId="0">'
   +'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
   +'<cols>'+cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')+'</cols>'
   +'<sheetData><row r="1">'
   +cols.map((c,i)=>`<c r="${colName(i)}1" s="1" t="inlineStr"><is><t>${xmlEsc(c.t)}</t></is></c>`).join('')
   +'</row>';
  rows.forEach((row,ri)=>{
    const r=ri+2;
    x+=`<row r="${r}">`+row.map((v,i)=>{
      if(v==null || v==='') return '';
      const ref=colName(i)+r, tipo=(cols[i]||{}).tipo||'txt';
      if(tipo==='fecha'){ const d=xlDate(v);
        return d==null ? `<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`
                       : `<c r="${ref}" s="2"><v>${d}</v></c>`; }
      if(tipo==='num'){ const n=Number(v); return isNaN(n)?'':`<c r="${ref}"><v>${n}</v></c>`; }
      return `<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`;
    }).join('')+'</row>';
  });
  return x+'</sheetData></worksheet>';
}
function xlsxBlob(hojas){
  const enc=new TextEncoder(), F=[], put=(n,s)=>F.push({name:n, data:enc.encode(s)});
  put('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    +'</Types>');
  put('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    +'</Relationships>');
  put('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
    +'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    +hojas.map((h,i)=>`<sheet name="${xmlEsc(h.nom)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')
    +'</sheets></workbook>');
  put('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
    +`<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
    +'</Relationships>');
  put('xl/styles.xml', XL_STYLES);
  hojas.forEach((h,i)=>put(`xl/worksheets/sheet${i+1}.xml`, sheetXml(h.cols,h.rows)));
  return zipBlob(F);
}

function armarHojas(){
  const all=DB.load().slice().sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));
  const H=[];
  const colTanda=[
    {t:'Fecha',w:11,tipo:'fecha'},{t:'Alumno',w:26},{t:'Sala',w:24},{t:'Modo',w:13},
    {t:'Ejercicios',w:11,tipo:'num'},{t:'Practicó (con ayuda)',w:19,tipo:'num'},
    {t:'Sin ayuda',w:11,tipo:'num'},{t:'% sin ayuda',w:12,tipo:'num'},
    {t:'Pistas',w:8,tipo:'num'},{t:'Salteadas',w:10,tipo:'num'},{t:'Minutos',w:9,tipo:'num'}];
  ANIOS_ORDEN.forEach(a=>H.push({nom:a, cols:colTanda,
    rows: all.filter(t=>t.anio===a).map(t=>[
      t.fecha, t.alumno, t.salaNom||t.sala, nombreModo(t.modo),
      t.total, t.resueltos, t.sinAyuda, pct(t.sinAyuda,t.total),
      t.pistas, t.salteadas, mins(t.seg)])}));

  const pa={};
  all.forEach(t=>{
    const k=t.anio+'|'+t.alumno;
    const o=pa[k]||(pa[k]={alumno:t.alumno,anio:t.anio,tandas:0,ej:0,sin:0,pistas:0,salt:0,seg:0,ult:''});
    o.tandas++; o.ej+=t.total||0; o.sin+=t.sinAyuda||0; o.pistas+=t.pistas||0;
    o.salt+=t.salteadas||0; o.seg+=t.seg||0; if(String(t.fecha||'')>o.ult) o.ult=t.fecha||'';
  });
  H.push({nom:'Por alumno', cols:[
    {t:'Alumno',w:26},{t:'Año',w:7},{t:'Tandas',w:8,tipo:'num'},{t:'Ejercicios',w:11,tipo:'num'},
    {t:'Sin ayuda',w:11,tipo:'num'},{t:'% sin ayuda',w:12,tipo:'num'},{t:'Pistas',w:8,tipo:'num'},
    {t:'Salteadas',w:10,tipo:'num'},{t:'Minutos',w:9,tipo:'num'},{t:'Última vez',w:12,tipo:'fecha'}],
   rows:Object.values(pa)
    .sort((a,b)=>a.anio.localeCompare(b.anio)||a.alumno.localeCompare(b.alumno,'es'))
    .map(o=>[o.alumno,o.anio,o.tandas,o.ej,o.sin,pct(o.sin,o.ej),o.pistas,o.salt,mins(o.seg),o.ult])});

  const pc={};
  all.forEach(t=>(t.ejs||[]).forEach(e=>{
    const k=t.anio+'|'+e.c;
    const o=pc[k]||(pc[k]={con:e.c,anio:t.anio,n:0,sin:0,pistas:0,salt:0});
    o.n++; if(e.ok1)o.sin++; o.pistas+=e.p||0; if(e.s)o.salt++;
  }));
  H.push({nom:'Por concepto', cols:[
    {t:'Concepto',w:34},{t:'Año',w:7},{t:'Veces hecho',w:12,tipo:'num'},
    {t:'Sin ayuda',w:11,tipo:'num'},{t:'% sin ayuda',w:12,tipo:'num'},
    {t:'Pistas',w:8,tipo:'num'},{t:'Salteados',w:10,tipo:'num'}],
   rows:Object.values(pc)
    .sort((a,b)=>a.anio.localeCompare(b.anio)||pct(a.sin,a.n)-pct(b.sin,b.n))
    .map(o=>[o.con,o.anio,o.n,o.sin,pct(o.sin,o.n),o.pistas,o.salt])});

  const det=[];
  all.forEach(t=>(t.ejs||[]).forEach(e=>det.push([
    t.fecha,t.alumno,t.anio,t.salaNom||t.sala,e.c,e.t,e.q,
    e.i, e.ok1?'SÍ':'no', e.ok?'sí':'no', e.p||0, e.s?'sí':'', e.sg||0])));
  H.push({nom:'Detalle', cols:[
    {t:'Fecha',w:11,tipo:'fecha'},{t:'Alumno',w:26},{t:'Año',w:7},{t:'Sala',w:24},{t:'Concepto',w:32},
    {t:'Tipo',w:9},{t:'Consigna',w:64},{t:'Intentos',w:9,tipo:'num'},{t:'Sin ayuda',w:11},
    {t:'Lo resolvió',w:12},{t:'Pistas',w:8,tipo:'num'},{t:'Salteado',w:10},{t:'Segundos',w:10,tipo:'num'}],
   rows:det});
  return H;
}
function exportarXlsx(){
  const H=armarHojas();
  if(!H.some(h=>h.rows.length)){ alert('Todavía no hay resultados guardados en esta máquina.'); return; }
  try{ bajar(xlsxBlob(H), `practica-programacion-${hoyISO()}.xlsx`); }
  catch(e){ alert('No se pudo generar la planilla: '+e.message); }
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* -------------------- resplandor que sigue al mouse -------------------- */
(function(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let x=0, y=0, pedido=false;
  addEventListener('pointermove', e=>{
    if(e.pointerType==='touch') return;      // en tablet molesta más que suma
    x=e.clientX; y=e.clientY;
    if(pedido) return;
    pedido=true;
    requestAnimationFrame(()=>{
      document.body.style.setProperty('--mx', x+'px');
      document.body.style.setProperty('--my', y+'px');
      document.body.classList.add('hasmouse');
      pedido=false;
    });
  }, {passive:true});
  addEventListener('pointerleave', ()=>document.body.classList.remove('hasmouse'));
})();

function tk(line,ln){
  const T=[];let i=0;
  const isD=c=>c>="0"&&c<="9", isA=c=>/[A-Za-z_]/.test(c), isAN=c=>/[A-Za-z0-9_]/.test(c);
  while(i<line.length){
    const c=line[i];
    if(c===" "||c==="\t"){i++;continue}
    if(c==="#")break;
    if(isD(c)||(c==="."&&isD(line[i+1]))){let j=i;while(j<line.length&&/[0-9.]/.test(line[j]))j++;
      T.push({t:"num",v:parseFloat(line.slice(i,j)),ln});i=j;continue}
    if(isA(c)){let j=i;while(j<line.length&&isAN(line[j]))j++;T.push({t:"name",v:line.slice(i,j),ln});i=j;continue}
    if(c==='"'||c==="'"){const q=c;let j=i+1,s="";while(j<line.length&&line[j]!==q){s+=line[j];j++}
      if(j>=line.length)throw{ln,msg:"Te faltó cerrar la comilla"};T.push({t:"str",v:s,ln});i=j+1;continue}
    const two=line.slice(i,i+2);
    if(["==","!=","<=",">=","//"].includes(two)){T.push({t:"op",v:two,ln});i+=2;continue}
    if("+-*/%<>=(),:".includes(c)){T.push({t:"op",v:c,ln});i++;continue}
    throw{ln,msg:`No entiendo el símbolo "${c}"`};
  }
  return T;
}
function P(T,ln){
  let i=0;
  const peek=()=>T[i], eat=v=>{if(T[i]&&T[i].v===v){i++;return true}return false};
  const expect=v=>{if(!eat(v))throw{ln,msg:`Esperaba "${v}" acá`}};
  function or_(){let l=and_();while(peek()&&(peek().v==="or"||peek().v==="o")){i++;l={k:"log",op:"or",l,r:and_()}}return l}
  function and_(){let l=not_();while(peek()&&(peek().v==="and"||peek().v==="y")){i++;l={k:"log",op:"and",l,r:not_()}}return l}
  function not_(){if(peek()&&(peek().v==="not"||peek().v==="no")){i++;return{k:"not",e:not_()}}return cmp_()}
  function cmp_(){let l=add_();while(peek()&&["==","!=","<=",">=","<",">"].includes(peek().v)){const o=T[i++].v;l={k:"cmp",op:o,l,r:add_()}}return l}
  function add_(){let l=mul_();while(peek()&&(peek().v==="+"||peek().v==="-")){const o=T[i++].v;l={k:"bin",op:o,l,r:mul_()}}return l}
  function mul_(){let l=un_();while(peek()&&["*","/","%","//"].includes(peek().v)){const o=T[i++].v;l={k:"bin",op:o,l,r:un_()}}return l}
  function un_(){if(peek()&&peek().v==="-"){i++;return{k:"neg",e:un_()}}return pri_()}
  function pri_(){
    const t=peek();
    if(!t)throw{ln,msg:"La línea quedó incompleta"};
    if(t.t==="num"){i++;return{k:"num",v:t.v}}
    if(t.t==="str"){i++;return{k:"str",v:t.v}}
    if(t.v==="("){i++;const e=or_();expect(")");return e}
    if(t.t==="name"){i++;
      if(peek()&&peek().v==="("){i++;const args=[];
        if(!(peek()&&peek().v===")")){args.push(or_());while(eat(","))args.push(or_())}
        expect(")");return{k:"call",n:t.v,args,ln}}
      return{k:"var",n:t.v,ln}}
    throw{ln,msg:`No esperaba "${t.v}" acá`};
  }
  const e=or_();
  if(i<T.length)throw{ln,msg:`Sobra "${T[i].v}" al final de la línea`};
  return e;
}
function parsePy(src){
  const raw=src.replace(/\r/g,"").split("\n");
  const L=[];
  raw.forEach((s,k)=>{const noC=s.split("#")[0];
    if(!noC.trim())return;
    L.push({ind:(s.match(/^[ \t]*/)[0].replace(/\t/g,"    ")).length,txt:noC.trim(),ln:k+1})});
  let p=0;
  function block(minInd){
    const out=[];
    while(p<L.length&&L[p].ind>=minInd){
      if(L[p].ind>minInd)throw{ln:L[p].ln,msg:"Esta línea tiene demasiada sangría"};
      out.push(stmt(minInd));
    }
    return out;
  }
  function body(cur,ln){
    if(p>=L.length||L[p].ind<=cur)throw{ln,msg:"Después de los dos puntos falta el bloque indentado (4 espacios)"};
    return block(L[p].ind);
  }
  function stmt(cur){
    const l=L[p], t=l.txt, ln=l.ln;
    const head=(kw)=>t===kw||t.startsWith(kw+" ")||t.startsWith(kw+"(");
    if(head("if")||head("while")){
      const kw=head("if")?"if":"while";
      if(!t.endsWith(":"))throw{ln,msg:`Al final del ${kw} falta los dos puntos ":"`};
      const cond=P(tk(t.slice(kw.length,-1),ln),ln);p++;
      const b=body(cur,ln);
      if(kw==="while")return{k:"while",cond,b,ln};
      const node={k:"if",arms:[{cond,b}],els:null,ln};
      while(p<L.length&&L[p].ind===cur&&(L[p].txt.startsWith("elif ")||L[p].txt==="else:"||L[p].txt.startsWith("else:"))){
        const e=L[p];
        if(e.txt.startsWith("elif")){
          if(!e.txt.endsWith(":"))throw{ln:e.ln,msg:'Al final del elif falta los dos puntos ":"'};
          const c2=P(tk(e.txt.slice(4,-1),e.ln),e.ln);p++;node.arms.push({cond:c2,b:body(cur,e.ln)});
        }else{p++;node.els=body(cur,e.ln);break}
      }
      return node;
    }
    if(head("for")){
      const m=t.match(/^for\s+([A-Za-z_]\w*)\s+in\s+range\((.+)\)\s*:$/);
      if(!m)throw{ln,msg:'El for se escribe así:  for i in range(5):'};
      const n=P(tk(m[2],ln),ln);p++;return{k:"for",v:m[1],n,b:body(cur,ln),ln};
    }
    if(t.startsWith("else")||t.startsWith("elif"))throw{ln,msg:`"${t.split(" ")[0]}" sin un if arriba`};
    const eq=t.search(/(?<![=!<>])=(?!=)/);
    if(eq>0&&/^[A-Za-z_]\w*\s*$/.test(t.slice(0,eq))){
      const name=t.slice(0,eq).trim(), e=P(tk(t.slice(eq+1),ln),ln);p++;return{k:"set",n:name,e,ln};
    }
    const e=P(tk(t,ln),ln);p++;
    if(e.k!=="call")throw{ln,msg:"Esta línea no hace nada. ¿Te faltó una orden o un = ?"};
    return{k:"exp",e,ln};
  }
  const prog=block(0);
  if(p<L.length)throw{ln:L[p].ln,msg:"No entiendo la sangría de esta línea"};
  return prog;
}

const LEDS=[{p:4,c:"#f87171",l:"rojo"},{p:5,c:"#fbbf24",l:"amarillo"},{p:6,c:"#34d399",l:"verde"},
            {p:8,c:"#38bdf8",l:"bomba"},{p:9,c:"#f472b6",l:"buzzer"},{p:13,c:"#e2e8f0",l:"LED placa"}];
let SIM={pins:{},an:{A0:512},out:[],vars:{},trans:0,servo:null};
let RUN={stop:true,live:false};
function simReset(keepAn){const a=keepAn?SIM.an:{A0:512};SIM={pins:{},an:a,out:[],vars:{},trans:0,servo:null}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function execPy(prog,ctx){
  const env=ctx.env;
  let steps=0, vt=0;
  const bump=()=>{if(++steps>ctx.maxSteps)throw{ln:0,msg:"El programa hizo demasiadas cosas. ¿Un bucle sin esperar()?"}};
  async function ev(n){
    bump();
    switch(n.k){
      case "num":return n.v;
      case "str":return n.v;
      case "var":{
        if(/^A[0-5]$/.test(n.n))return n.n;
        if(n.n==="True")return true; if(n.n==="False")return false;
        if(!(n.n in env))throw{ln:n.ln,msg:`La variable "${n.n}" todavía no existe. ¿La escribiste distinto arriba?`};
        return env[n.n]}
      case "neg":return -(await ev(n.e));
      case "not":return !(await ev(n.e));
      case "log":{const l=await ev(n.l);
        if(n.op==="and")return l?await ev(n.r):l; return l?l:await ev(n.r)}
      case "cmp":{const a=await ev(n.l),b=await ev(n.r);
        switch(n.op){case "==":return a===b;case "!=":return a!==b;case "<":return a<b;
          case ">":return a>b;case "<=":return a<=b;case ">=":return a>=b}}
      case "bin":{const a=await ev(n.l),b=await ev(n.r);
        switch(n.op){case "+":return (typeof a==="string"||typeof b==="string")?String(a)+String(b):a+b;
          case "-":return a-b;case "*":return a*b;
          case "/":{if(b===0)throw{ln:n.ln,msg:"No se puede dividir por cero"};return a/b}
          case "//":return Math.floor(a/b);case "%":return a%b}}
      case "call":return await call(n);
    }
  }
  async function call(n){
    const a=[];for(const x of n.args)a.push(await ev(x));
    const need=(k)=>{if(a.length<k)throw{ln:n.ln,msg:`A ${n.n}() le faltan datos adentro del paréntesis`}};
    switch(n.n){
      case "prender":{need(1);const p=+a[0];if(SIM.pins[p]!==1)SIM.trans++;SIM.pins[p]=1;ctx.paint();return null}
      case "apagar":{need(1);const p=+a[0];if(SIM.pins[p]===1)SIM.trans++;SIM.pins[p]=0;ctx.paint();return null}
      case "leer":{need(1);const p=a[0];const v=SIM.an[p];
        if(v===undefined)throw{ln:n.ln,msg:`No hay ningún sensor en ${p}. Probá con A0`};return v}
      case "mostrar":{need(1);SIM.out.push(String(typeof a[0]==="number"?Math.round(a[0]*100)/100:a[0]));
        if(SIM.out.length>200)SIM.out.shift();ctx.paint();return null}
      case "servo":{need(2);SIM.servo=+a[1];ctx.paint();return null}
      case "esperar":{need(1);const s=Math.max(0,+a[0]);
        if(ctx.live){await sleep(Math.min(s,3)*1000)}else{vt+=s;if(vt>ctx.maxVT)throw{stopok:true}}
        return null}
      case "redondear":{need(1);return Math.round(a[0])}
      case "range":throw{ln:n.ln,msg:"range() solo se usa adentro de un for"};
      default:throw{ln:n.ln,msg:`No conozco la orden "${n.n}()". Mirá la lista de órdenes abajo.`};
    }
  }
  async function block(b){for(const s of b){if(RUN.stop&&ctx.live)throw{stopok:true};await run1(s)}}
  async function run1(s){
    bump();
    switch(s.k){
      case "set":{env[s.n]=await ev(s.e);SIM.vars=Object.assign({},env);ctx.paint();return}
      case "exp":await ev(s.e);return;
      case "if":{for(const arm of s.arms){if(await ev(arm.cond))return await block(arm.b)}
        if(s.els)return await block(s.els);return}
      case "while":{let guard=0;
        while(await ev(s.cond)){
          await block(s.b);
          if(ctx.live){await sleep(0)}else{vt+=0.001;if(vt>ctx.maxVT)throw{stopok:true}}
          if(RUN.stop&&ctx.live)throw{stopok:true};
          if(++guard>ctx.maxLoop)throw{stopok:true};
        }return}
      case "for":{const n=Math.min(+(await ev(s.n)),ctx.maxLoop);
        for(let k=0;k<n;k++){env[s.v]=k;SIM.vars=Object.assign({},env);await block(s.b);
          if(ctx.live){await sleep(0)}
          if(RUN.stop&&ctx.live)throw{stopok:true}}
        return}
    }
  }
  await block(prog);
}

/* corre el código; devuelve {err, pins, out, trans, servo} */
async function misRunCode(code,opt){
  opt=opt||{};
  const live=!!opt.live;
  simReset(!!opt.keepAn);
  if(opt.an)SIM.an=Object.assign({},SIM.an,opt.an);
  const ctx={env:{},live,paint:live?misPaint:()=>{},maxSteps:live?4e6:2e5,maxVT:opt.maxVT||14,maxLoop:live?1e9:4000};
  RUN.stop=false;RUN.live=live;
  let err=null;
  try{
    const prog=parsePy(code);
    if(!prog.length)err={ln:0,msg:"Todavía no escribiste ninguna orden."};
    else await execPy(prog,ctx);
  }catch(e){ if(!e||!e.stopok) err=(e&&e.msg)?e:{ln:0,msg:"Algo salió mal: "+(e&&e.message||e)} }
  RUN.stop=true;
  if(live)misPaint();
  return {err,pins:Object.assign({},SIM.pins),out:SIM.out.slice(),trans:SIM.trans,servo:SIM.servo};
}

let MIS_T0=0, MIS_TRIES=0;
function guardarMision(i){
  if(typeof SES==='undefined' || !SES || typeof DB==='undefined') return false;
  const m=MIS[i];
  const seg=MIS_T0 ? Math.max(1, Math.round((Date.now()-MIS_T0)/1000)) : 0;
  const ok1 = MIS_TRIES<=1;
  const concepto = `Misión ${i+1} · ${m.c}`;
  const guardado = DB.add({
    id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    alumno:SES.nombre, anio:SES.anio, fecha:SES.fecha, ts:new Date().toISOString(),
    sala:'misiones', salaNom:'Misiones · programá la placa', modo:(typeof MODO!=='undefined'?MODO.id:'practica'),
    total:1, resueltos:1, sinAyuda: ok1?1:0,
    pistas:0, salteadas:0, seg:seg,
    ejs:[{c:concepto, t:'mision', q:m.t, i:MIS_TRIES, ok:true, ok1:ok1, p:0, s:false, sg:seg}]
  });
  if(guardado && typeof enviarPendientes==='function') enviarPendientes();
  return guardado;
}
