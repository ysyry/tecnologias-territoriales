<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecnología para el territorio</title>
<style>
  :root{
    --bg:#0a0c11; --surface:#121620; --surface2:#182030; --raise:#1d2434;
    --line:#212836; --line2:#303a4d;
    --txt:#e6eaf1; --muted:#8b96a8; --faint:#5a6474;
    --accent:#63b3f2; --accent-dim:rgba(99,179,242,.13);
    --good:#54cf94; --bad:#f08a8a; --warn:#e8b654; --violet:#9b9bf0;
    --r:12px; --r2:16px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:transparent;color:var(--txt);min-height:100vh;line-height:1.6;position:relative;
    -webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03"}

  /* ---- ambiente: aurora, grid y resplandor que sigue el mouse ---- */
  html::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
    background:
      radial-gradient(62vw 52vh at 12% -8%, rgba(155,155,240,.20), transparent 62%),
      radial-gradient(58vw 46vh at 92% 4%,  rgba(99,179,242,.15), transparent 62%),
      radial-gradient(52vw 44vh at 55% 104%,rgba(155,155,240,.13), transparent 62%);
    animation:aurora 26s ease-in-out infinite alternate}
  @keyframes aurora{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(0,-2.5%,0) scale(1.07)}}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      linear-gradient(rgba(155,155,240,.045) 1px, transparent 1px) 0 0/100% 58px,
      linear-gradient(90deg, rgba(155,155,240,.045) 1px, transparent 1px) 0 0/58px 100%;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 88%);
    mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 88%)}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;
    transition:opacity .5s ease;
    background:radial-gradient(320px circle at var(--mx,50%) var(--my,30%),
      rgba(155,155,240,.15), rgba(99,179,242,.06) 45%, transparent 68%)}
  body.hasmouse::after{opacity:1}
  @media(prefers-reduced-motion:reduce){
    html::before{animation:none}
    body::after{display:none}}
  header{padding:26px 20px 22px;text-align:center;border-bottom:1px solid var(--line);
    margin-bottom:26px;position:relative;background:linear-gradient(180deg,rgba(155,155,240,.05),transparent)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(155,155,240,.65),rgba(99,179,242,.65),transparent);
    background-size:220% 100%;animation:sweep 9s ease-in-out infinite}
  @keyframes sweep{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  @media(prefers-reduced-motion:reduce){header::after{animation:none}}
  header .esc{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin-bottom:9px}
  header h1{margin:0;font-size:1.26rem;color:#fff;font-weight:640;letter-spacing:-.02em}
  header p{margin:6px 0 0;color:var(--faint);font-size:.84rem;letter-spacing:.01em}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px 90px}
  .card{background:rgba(18,22,32,.78);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    border:1px solid var(--line);border-radius:var(--r2);padding:24px;margin-bottom:14px}
  h2{margin:.1em 0 .55em;font-size:1.32rem;font-weight:640;letter-spacing:-.02em;color:#fff}
  h3{font-size:1.02rem;margin:.2em 0;font-weight:620;letter-spacing:-.01em}
  .muted{color:var(--muted)}
  a{color:var(--accent)}

  /* ---- menú ---- */
  .mod{margin-bottom:34px}
  .mod .mt{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    font-weight:700;margin:0 0 5px}
  .mod .md{font-size:.88rem;color:var(--muted);margin:0 0 15px;line-height:1.6;max-width:60ch}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .item{background:rgba(18,22,32,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;position:relative;
    cursor:pointer;text-align:left;color:inherit;font-family:inherit;font-size:inherit;
    transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;
    display:flex;flex-direction:column;gap:5px}
  .item:hover{border-color:rgba(155,155,240,.5);background:var(--surface2);transform:translateY(-2px);
    box-shadow:0 6px 26px -12px rgba(155,155,240,.55)}
  .item:active{transform:none}
  .item .n{font-weight:620;font-size:1rem;color:#fff;letter-spacing:-.01em}
  .item .d{font-size:.845rem;color:var(--muted);line-height:1.55}
  .item .foot{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
  .item.wide{grid-column:1/-1}
  .item.dest{background:rgba(24,32,48,.78);border-color:var(--line2);overflow:hidden}
  .item.dest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--violet),var(--accent));opacity:.6;transition:opacity .18s}
  .item.dest:hover::before{opacity:1}
  .lvl{font-size:.68rem;font-weight:640;letter-spacing:.04em;border-radius:5px;padding:2.5px 7px;
    background:var(--raise);color:var(--muted)}
  .lvl.l1{color:var(--good)} .lvl.l2{color:var(--accent)} .lvl.l3{color:var(--warn)}
  .hecho{font-size:.72rem;color:var(--good);font-weight:640;margin-left:auto;letter-spacing:.01em}
  .sala{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:15px;
    cursor:pointer;transition:.15s;text-align:left;color:var(--txt);font-family:inherit;font-size:.9rem;width:100%}
  .sala:hover{border-color:var(--line2)}
  .concepto{display:inline-block;color:var(--faint);border:1px solid var(--line);border-radius:6px;
    padding:3px 9px;font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .concepto.big{margin:0 0 15px}

  /* ---- barra de ejercicio ---- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .backb{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;font-size:.83rem;cursor:pointer;font-family:inherit;transition:.15s}
  .backb:hover{border-color:var(--line2);color:var(--txt)}
  .progtext{margin-left:auto;font-size:.8rem;color:var(--faint);font-variant-numeric:tabular-nums}
  .score{font-weight:700;color:var(--muted)}
  .bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--accent));
    transition:width .35s ease;width:0}

  /* ---- consigna y código ---- */
  .consigna{font-size:1.06rem;font-weight:560;margin-bottom:14px;line-height:1.55;letter-spacing:-.01em;color:#fff}
  .code,.cblock{background:#0b0e15;border:1px solid var(--line);border-radius:10px;padding:15px 17px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem;line-height:1.75;
    color:#d5dce8;overflow-x:auto;margin:13px 0}
  .code{white-space:pre}
  .cline{white-space:pre;border-radius:4px;padding:0 6px;margin:0 -6px;transition:.15s}
  .cline.hot{background:rgba(232,182,84,.14);box-shadow:inset 2px 0 0 var(--warn)}
  .kw{color:var(--violet);font-weight:600}
  .num{color:var(--warn)} .str{color:var(--good)} .cmt{color:var(--faint)}
  .blank{color:var(--accent);font-weight:700}
  .cbhdr{font-size:.72rem;font-weight:700;color:var(--faint);margin:2px 0 7px;
    letter-spacing:.08em;text-transform:uppercase}

  /* ---- opciones ---- */
  .opts{display:grid;gap:8px;margin-top:6px}
  button.opt{background:var(--surface2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;font-size:.97rem;text-align:left;cursor:pointer;transition:.13s;
    font-family:inherit;line-height:1.5}
  button.opt:hover:not(:disabled){border-color:var(--line2);background:var(--raise)}
  button.opt.ok{border-color:var(--good);background:rgba(84,207,148,.1);color:#fff}
  button.opt.no{border-color:var(--bad);background:rgba(240,138,138,.09)}
  button.opt:disabled{cursor:default;opacity:.75}
  button.opt.ok:disabled,button.opt.no:disabled{opacity:1}
  button.opt.mono{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;white-space:pre}

  /* ---- ordenar (parsons) ---- */
  .parsons{display:grid;gap:14px}
  @media(min-width:640px){.parsons{grid-template-columns:1fr 1fr}}
  .pcol h4{margin:0 0 8px;font-size:.7rem;color:var(--faint);text-transform:uppercase;
    letter-spacing:.1em;font-weight:700}
  .pbin,.pbuild{min-height:58px;background:#0b0e15;border:1px dashed var(--line2);border-radius:10px;
    padding:8px;display:flex;flex-direction:column;gap:7px}
  .pbuild{border-style:solid;border-color:var(--line)}
  .pline{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;
    cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:.87rem;white-space:pre;transition:.13s}
  .pline:hover{border-color:var(--line2);background:var(--raise)}
  .pline.locked{cursor:default}
  .pline.okline{border-color:var(--good);background:rgba(84,207,148,.09)}
  .pline.noline{border-color:var(--bad);background:rgba(240,138,138,.09)}
  .emptyhint{color:var(--faint);font-size:.8rem;text-align:center;padding:13px 6px}

  /* ---- escenario ---- */
  .stage{background:#0b0e15;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:6px}
  .sttitle{font-size:.72rem;font-weight:700;color:var(--faint);margin:2px 0 9px;
    letter-spacing:.08em;text-transform:uppercase}
  .stcanvas{width:100%;max-width:340px;height:auto;display:block;margin:8px auto;background:#080b11;
    border-radius:8px;border:1px solid var(--line)}
  .vpanel{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px;min-height:26px}
  .vchip{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;
    font-size:.84rem;font-family:ui-monospace,Menlo,monospace;transition:.15s}
  .vchip.chg{border-color:var(--warn);background:rgba(232,182,84,.12)}
  .vchip b{color:var(--warn);font-weight:600}
  .out{background:#06080d;border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin:8px 0 4px;
    font-family:ui-monospace,Menlo,monospace;font-size:.86rem;color:var(--good);min-height:20px}
  .runctrl{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .rbtn{background:var(--raise);color:var(--txt);border:1px solid var(--line2);border-radius:8px;
    padding:8px 14px;font-size:.86rem;cursor:pointer;font-family:inherit;font-weight:560;transition:.13s}
  .rbtn:hover{border-color:var(--accent);color:#fff}
  .rbtn.ghost{background:transparent}
  .slider{width:100%;accent-color:var(--accent);margin:2px 0 12px;cursor:pointer}
  .hint{background:var(--accent-dim);border-left:2px solid var(--accent);padding:11px 14px;
    border-radius:8px;font-size:.87rem;margin:11px 0;line-height:1.6}

  /* ---- modo Jr (visual, mantiene los emojis a propósito) ----
     Todo grande a propósito: se maneja con clics de dedo grueso y sin
     leer una palabra. El tamaño de celda lo fija jrRender con --jrc
     según cuántas columnas tenga la misión, para que nunca se corte. */
  .jrwrap{text-align:center}
  .jrgrid{display:grid;gap:10px;justify-content:center;margin:18px auto}
  .jrcell{width:var(--jrc,96px);height:var(--jrc,96px);border-radius:16px;background:#0b0e15;
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--jrc,96px) * .56);line-height:1}
  .jrcell.goal{background:rgba(232,182,84,.14);border-color:var(--warn)}
  .jrcell.wall{background:#2e2620;border-color:#4a3c2e}
  .nivdot{background:none;border:0;color:var(--b1);font-size:1.25rem;padding:6px 3px;cursor:pointer;min-width:30px;min-height:40px;letter-spacing:0}
  .nivdot.salta{font-size:1.5rem;margin-left:10px}
  .jrnow{display:inline-block;outline:3px solid var(--b1);border-radius:10px;transform:scale(1.18)}
  .bamal{display:inline-block;outline:3px solid #e5484d;border-radius:10px}
  .jrstrip{min-height:78px;background:#0b0e15;border:2px dashed var(--line2);border-radius:16px;padding:10px;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0;font-size:2.6rem}
  .jrbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .jrbtn{font-size:2.6rem;width:98px;height:88px;border-radius:20px;border:2px solid var(--line2);
    background:var(--surface2);color:var(--txt);cursor:pointer;transition:.1s;line-height:1}
  /* En pantalla ancha, el tablero a la izquierda y los controles a la
     derecha: así el ▶ entra sin scrollear en las PC de la escuela.
     Que el botón quede fuera de la pantalla es una barrera real para
     quien usa esto solo. */
  .jrcols{display:grid;gap:20px;align-items:center;justify-items:center}
  @media(min-width:840px){ .jrcols{grid-template-columns:auto 1fr} }
  .jrbtn:active{transform:scale(.93)}
  .jrgo{font-size:2.4rem;font-weight:700;padding:16px 44px;border-radius:20px;border:none;
    background:var(--good);color:#0a0c11;cursor:pointer;line-height:1}
  .jrgo:active{transform:scale(.96)}
  .jrmsg{font-size:2rem;font-weight:700;margin:12px 0;min-height:46px}

  /* ---- el baile (coreografía visual) ----
     La escuela no tiene parlantes: el compás se VE, no se escucha.
     Los pasos son íconos grandes y la bailarina los hace con transform. */
  .bawrap{text-align:center}
  .baesc{background:#0b0e15;border:2px solid var(--line);border-radius:20px;height:240px;
    display:flex;align-items:flex-end;justify-content:center;margin:14px 0;position:relative;overflow:hidden}
  .bapiso{position:absolute;left:0;right:0;bottom:0;height:30px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
  .badan{font-size:7rem;line-height:1;margin-bottom:24px;position:relative;
    transition:transform .34s cubic-bezier(.34,1.4,.5,1);transform-origin:50% 92%}
  .badan.pA{transform:translateY(-20px) scale(1.1)}
  .badan.pP{transform:scaleX(.82) scale(1.06)}
  .badan.pG{transform:rotate(360deg)}
  .badan.pC{transform:translateX(58px)}
  .badan.pS{transform:translateY(-58px) scale(1.05)}
  .badan.pR{transform:rotate(22deg) translateY(12px)}
  .bacompas{display:flex;gap:12px;justify-content:center;margin:6px 0 2px}
  .bapulso{width:18px;height:18px;border-radius:50%;background:var(--surface2);
    border:2px solid var(--line2);transition:.15s}
  .bapulso.on{background:var(--good);border-color:var(--good);transform:scale(1.35)}
  /* los seis pasos siempre en 3 × 2: la misma forma en toda pantalla, que es
     lo que hace que se pueda usar de memoria */
  .bapasos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:390px;margin:0 auto}
  .bapaso{font-size:2.7rem;width:100%;min-height:92px;padding:10px 4px;border-radius:20px;
    border:2px solid var(--line2);background:var(--surface2);color:var(--txt);cursor:pointer;
    transition:.12s;line-height:1;font-family:inherit}
  /* los controles tienen que verse DISTINTOS de los pasos: si son del mismo
     tamaño, el ▶ parece un paso más de la coreografía */
  .bapaso.chico{width:84px;min-height:66px;font-size:1.9rem}
  .bactrl{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
  .bapaso:active{transform:scale(.93)}
  .bapaso.on{border-color:var(--good);background:var(--accent-dim);transform:scale(1.12)}
  .bapal{display:block;font-size:.82rem;font-weight:700;margin-top:7px;text-transform:uppercase;
    letter-spacing:.4px;color:var(--txt)}

  /* ---- casa de imágenes: el inicio de la sección Jr, sin texto ---- */
  .casa{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:34px 0}
  .casab{width:230px;height:230px;border-radius:28px;border:3px solid var(--line2);
    background:var(--surface2);color:var(--txt);cursor:pointer;font-size:6.5rem;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.14s;font-family:inherit}
  .casab:hover{border-color:var(--good);transform:translateY(-4px)}
  .casab:active{transform:scale(.96)}
  .casapie{display:flex;justify-content:center;margin-top:22px}
  .casacfg{font-size:1rem;width:40px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:transparent;color:var(--faint);cursor:pointer;font-family:inherit;opacity:.5}
  .casacfg:hover{opacity:1}

  /* ---- proyectos de 4to: esquema de conexión y tabla de elecciones ---- */
  .esqt{width:100%;border-collapse:collapse;margin:14px 0;font-size:.92rem}
  .esqt th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line2);
    color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px}
  .esqt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .esqt tr:last-child td{border-bottom:none}
  .opsl{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}
  .opch{display:inline-block;padding:9px 14px;border-radius:11px;border:1px solid var(--line2);
    background:var(--surface2);color:var(--txt);font-size:.9rem;line-height:1.35;font-family:inherit}
  button.opch{cursor:pointer;transition:.12s;text-align:left}
  button.opch:hover{border-color:var(--muted)}
  button.opch.on{border-color:var(--good);background:var(--accent-dim);font-weight:600}
  button.opch:focus-visible{outline:3px solid var(--good);outline-offset:2px}

  /* ---- poner cada cosa en su lugar: emparejar y rompecabezas ---- */
  .pogrid{display:grid;gap:12px;justify-content:center;margin:4px auto 0}
  .pocelda{width:112px;height:112px;border-radius:18px;border:2px dashed var(--line2);
    background:#0b0e15;display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    cursor:pointer;font-family:inherit;color:var(--txt);transition:.12s;line-height:1}
  .pocelda .gh{opacity:.32}
  .pocelda.lista{border-style:solid;border-color:var(--good);background:var(--accent-dim)}
  .pocelda.sobre{border-color:var(--good);transform:scale(1.07)}
  .popiezas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:360px;margin:0 auto}
  .popieza{width:104px;height:96px;border-radius:18px;border:2px solid var(--line2);
    background:var(--surface2);font-size:3.2rem;cursor:grab;font-family:inherit;color:var(--txt);
    transition:.12s;line-height:1}
  .popieza.sel{border-color:var(--good);transform:scale(1.12) translateY(-4px)}
  .popieza:active{cursor:grabbing}
  .popieza:focus-visible,.pocelda:focus-visible{outline:4px solid var(--good);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){
    .pocelda.sobre,.popieza.sel{transform:none}
  }

  /* el mapa: los lugares se ubican encima del dibujo, en porcentaje */
  /* la caja tiene EXACTAMENTE la forma del dibujo (viewBox 100x200), si no
     el svg se centra adentro y los lugares caen corridos */
  .pomapa{--h:min(470px,60vh);position:relative;height:var(--h);width:calc(var(--h)/2);margin:0 auto}
  .pomapa svg{width:100%;height:100%;display:block}
  .pomapa .pocelda{position:absolute;width:64px;height:64px;font-size:1.9rem;
    transform:translate(-50%,-50%)}
  .pomapa .pocelda.sobre{transform:translate(-50%,-50%) scale(1.08)}
  @media(prefers-reduced-motion:reduce){
    .pomapa .pocelda.sobre{transform:translate(-50%,-50%)}
  }

  /* ---- el mapa: geografía con la misma mecánica de arrastrar y tocar ---- */
  /* la caja tiene EXACTAMENTE la forma del dibujo (--ar es ancho sobre alto):
     si no, el svg se centra adentro y los carteles caen corridos */
  .gemapa{--h:min(540px,68vh,130vw);position:relative;height:var(--h);
    width:calc(var(--h) * var(--ar,.6));margin:0 auto}
  .gemapa svg{width:100%;height:100%;display:block;overflow:visible}
  .gefondo{fill:#222a3b;stroke:#3d4863;stroke-width:.22;cursor:pointer}
  /* el lugar vacío se tiene que VER: es la consigna, no hay nada que leer */
  .geslot{fill:rgba(99,179,242,.18);stroke:rgba(160,190,230,.55);stroke-width:.5;
    stroke-dasharray:1.6 1.2;cursor:pointer;transition:fill .12s}
  .geslot.sobre{fill:rgba(84,207,148,.28)}

<script>
/* ============================================================
   PRÁCTICA DE PROGRAMACIÓN (POST SCRATCH) — Educación Informática
   Para 1ro y 2do (se le van agregando salas). Un único archivo,
   sin dependencias. Todo corre en el navegador.
   Los pibes leen pseudocódigo en castellano (puente Scratch->texto)
   y practican secuencia, bucles, condicionales, variables y debug.
   Autocorregido + ESCENARIO animado que ejecuta el código.
   ============================================================ */

/* -------- coloreado simple de pseudocódigo -------- */
const KW = ['repetir','veces','si','entonces','sino','mientras','mostrar','decir','esperar',
  'avanzar','girar','rebotar','al','hacer','clic','en','por','siempre','segundos','tocar','fin','grados','y','o','distinto'];
function paint(code){
  let s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/"([^"]*)"/g,'<span class="str">"$1"</span>');
  s = s.replace(/(#[^\n]*)/g,'<span class="cmt">$1</span>');
  s = s.replace(/___/g,'<span class="blank">___</span>');
  s = s.replace(/\b(\d+)\b/g,'<span class="num">$1</span>');
  KW.forEach(k=>{ s = s.replace(new RegExp('(?<![\\w])'+k+'(?![\\w])','g'),'<span class="kw">'+k+'</span>'); });
  return s;
}

function _svgWrap(w,h,inner){
  return `<svg viewBox="0 0 ${w} ${h}" class="flowsvg" xmlns="http://www.w3.org/2000/svg">`+
    `<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">`+
    `<path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>${inner}</svg>`;
}
function _fTxt(x,y,t){ return t?`<text x="${x}" y="${y+1}">${escapeHtml(t)}</text>`:''; }
function _fRect(cx,cy,w,h,txt,cls){ return `<rect class="${cls||'sh'}" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="7"/>`+_fTxt(cx,cy,txt); }
function _fPill(cx,cy,w,h,txt){ return `<rect class="se" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="${h/2}"/>`+_fTxt(cx,cy,txt); }
function _fDia(cx,cy,w,h,txt){ return `<polygon class="dec" points="${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}"/>`+_fTxt(cx,cy,txt); }
function _fLn(x1,y1,x2,y2){ return `<path class="ln" d="M${x1},${y1} L${x2},${y2}"/>`; }
function _fPoly(d){ return `<path class="ln" d="M${d}"/>`; }
function _fLbl(x,y,t){ return `<text class="lbl" x="${x}" y="${y}">${t}</text>`; }
function flowLinear(items){
  const W=300,bw=190,bh=34,gap=26,x=W/2; let y=14, parts=[];
  items.forEach((it,i)=>{ const cy=y+bh/2;
    if(i>0) parts.push(_fLn(x,y-gap,x,y));
    parts.push(it.f==='pill'?_fPill(x,cy,150,bh,it.txt):_fRect(x,cy,bw,bh,it.txt,it.f==='io'?'io':'sh'));
    y+=bh+gap; });
  return _svgWrap(W,y-gap+10,parts.join(''));
}

   Nada de imágenes externas: la app tiene que andar sin internet

   pantalla y acompañan la paleta.
   ============================================================ */
function _eSvg(w,h,inner){ return `<svg class="elecsvg" viewBox="0 0 ${w} ${h}">${inner}</svg>`; }
function _rayos(cx,cy,r){
  return [0,45,90,135,180,225,270,315].map(a=>{
    const k=a*Math.PI/180, c=Math.cos(k), s=Math.sin(k);
    return `<line class="ray" x1="${(cx+c*(r+5)).toFixed(1)}" y1="${(cy+s*(r+5)).toFixed(1)}"
      x2="${(cx+c*(r+12)).toFixed(1)}" y2="${(cy+s*(r+12)).toFixed(1)}"/>`;
  }).join('');
}
function _lampara(cx,cy,on){
  const r=21;
  return (on?_rayos(cx,cy,r):'')
    +`<circle class="bulb${on?' on':''}" cx="${cx}" cy="${cy}" r="${r}"/>
      <path class="fil${on?' on':''}" d="M${cx-9},${cy-6} L${cx-4},${cy+7} L${cx},${cy-3} L${cx+4},${cy+7} L${cx+9},${cy-6}"/>`;
}
function _pila(x,y,on){
  const c=on?' on':'';
  return `<line class="w${c}" x1="${x-17}" y1="${y-9}" x2="${x+17}" y2="${y-9}"/>
    <line class="w${c}" x1="${x-8}" y1="${y+3}" x2="${x+8}" y2="${y+3}"/>
    <text class="t sm" x="${x-27}" y="${y-12}">+</text>
    <text class="t sm" x="${x-27}" y="${y+11}">−</text>`;
}
function _llave(cx,cy,cerrado){
  const x1=cx-25, x2=cx+25;
  return `<circle class="pin" cx="${x1}" cy="${cy}" r="3.5"/><circle class="pin" cx="${x2}" cy="${cy}" r="3.5"/>
    <line class="w${cerrado?' on':''}" x1="${x1}" y1="${cy}" x2="${cerrado?x2:x2-7}" y2="${cerrado?cy:cy-25}"/>`;
}
function _resis(cx,cy){
  return `<path class="res" d="M${cx-21},${cy} l6,0 l3,-9 l6,18 l6,-18 l6,18 l6,-18 l3,9 l6,0"/>`;
}

/* (la sala de electrónica está más arriba, dentro de SALAS) */
function lexExpr(s){
  const out=[]; const re=/("[^"]*"|>=|<=|==|!=|[()+\-*/%<>=]|[A-Za-zÁÉÍÓÚáéíóúñÑ_]\w*|\d+\.\d+|\d+)/g;
  let m; while(m=re.exec(s)) out.push(m[0]); return out;
}
function truthy(v){ return !(v===false||v===0||v===''||v==null); }
function showVal(v){ return typeof v==='boolean' ? (v?'verdadero':'falso') : String(v); }
/* evaluador con precedencia: o < y < comparación < +/- < * / % < unario/paréntesis */
function evalExpr(expr, vars){
  const T=lexExpr(String(expr)); let p=0;
  const peek=()=>T[p], eat=()=>T[p++];
  const num=v=> typeof v==='number'?v:(typeof v==='boolean'?(v?1:0):(parseFloat(v)||0));
  function primary(){
    let t=eat();
    if(t==='('){ const v=orE(); if(peek()===')') eat(); return v; }
    if(t==='-') return -num(primary());
    if(t==='no') return !truthy(primary());
    if(t==null) return 0;
    if(t[0]==='"') return t.slice(1,-1);
    if(/^\d+\.\d+$/.test(t)) return parseFloat(t);
    if(/^\d+$/.test(t)) return parseInt(t,10);
    if(t==='verdadero') return true;
    if(t==='falso') return false;
    return (t in vars)?vars[t]:0;
  }
  function mulE(){ let v=primary(); while(['*','/','%'].includes(peek())){ const o=eat(), r=primary();
    v = o==='*'?num(v)*num(r): o==='/'?num(v)/num(r): num(v)%num(r); } return v; }
  function addE(){ let v=mulE(); while(peek()==='+'||peek()==='-'){ const o=eat(), r=mulE();
    v = o==='+' ? ((typeof v==='string'||typeof r==='string')?String(v)+String(r):num(v)+num(r)) : num(v)-num(r); } return v; }
  function cmpE(){ let v=addE(); const o=peek();
    if(['>','<','>=','<=','==','=','!=','distinto'].includes(o)){ eat(); const r=addE();
      switch(o){ case '>':return num(v)>num(r); case '<':return num(v)<num(r);
        case '>=':return num(v)>=num(r); case '<=':return num(v)<=num(r);
        case '==': case '=':return v===r||num(v)===num(r);
        case '!=': case 'distinto':return !(v===r||num(v)===num(r)); } }
    return v; }
  function andE(){ let v=cmpE(); while(peek()==='y'){ eat(); const r=cmpE(); v=truthy(v)&&truthy(r); } return v; }
  function orE(){ let v=andE(); while(peek()==='o'){ eat(); const r=andE(); v=truthy(v)||truthy(r); } return v; }
  return orE();
}
function parseProg(lines){
  let i=0;
  function block(minIndent){
    const out=[];
    while(i<lines.length){
      const raw=lines[i];
      if(!raw.trim()){ i++; continue; }
      const ind = raw.length - raw.replace(/^\s+/,'').length;
      if(ind < minIndent) break;
      const line=i, t=raw.trim(); let m;
      if(m=t.match(/^repetir\s+(\d+)\s+veces:?$/i)){ i++; const body=block(ind+1); out.push({op:'repeat',n:+m[1],line,body}); }
      else if(m=t.match(/^si\s+(.+?)\s+entonces:?$/i)){
        i++; const body=block(ind+1); let elseBody=null;
        let j=i; while(j<lines.length && !lines[j].trim()) j++;
        if(j<lines.length && (lines[j].length-lines[j].replace(/^\s+/,'').length)===ind && /^sino:?$/i.test(lines[j].trim())){
          i=j+1; elseBody=block(ind+1);
        }
        out.push({op:'if',cond:m[1],line,body,elseBody});
      }
      else { i++; out.push(parseLeaf(t,line)); }
    }
    return out;
  }
  return block(-1);
}
function parseLeaf(t,line){
  let m;
  if(m=t.match(/^avanzar\s+(\d+)/i))        return {op:'move',v:+m[1],line};
  if(m=t.match(/^girar\s+(\d+)/i))          return {op:'turn',v:+m[1],line};
  if(/^rebotar/i.test(t))                   return {op:'turn',v:180,line};
  if(/^apuntar/i.test(t))                   return {op:'point',line};
  if(m=t.match(/^(?:mostrar|decir)\s+(.+)$/i)) return {op:'show',expr:m[1],line};
  if(/^esperar/i.test(t))                   return {op:'wait',line};
  if(m=t.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/)) return {op:'assign',name:m[1],expr:m[2],line};
  return {op:'nop',line};
}
function simulate(lines){
  const ast=parseProg(lines);
  const frames=[]; const vars={};
  const t={x:0,y:0,heading:0}; const trail=[{x:0,y:0}]; const out=[];
  function snap(line, extra){
    frames.push(Object.assign({line, vars:Object.assign({},vars),
      turtle:{x:t.x,y:t.y,heading:t.heading}, trail:trail.map(p=>({x:p.x,y:p.y})), out:out.slice()}, extra||{}));
  }
  function run(nodes){
    for(const n of nodes){
      if(n.op==='repeat'){ snap(n.line); for(let k=0;k<n.n;k++) run(n.body); }
      else if(n.op==='if'){ snap(n.line); if(truthy(evalExpr(n.cond,vars))) run(n.body); else if(n.elseBody) run(n.elseBody); }
      else if(n.op==='move'){ const a=(t.heading-90)*Math.PI/180; t.x+=Math.cos(a)*n.v; t.y+=Math.sin(a)*n.v; trail.push({x:t.x,y:t.y}); snap(n.line); }
      else if(n.op==='turn'){ t.heading+=n.v; snap(n.line); }
      else if(n.op==='assign'){ vars[n.name]=evalExpr(n.expr,vars); snap(n.line,{changed:n.name}); }
      else if(n.op==='show'){ const r=showVal(evalExpr(n.expr,vars)); out.push(r); snap(n.line,{say:r}); }
      else snap(n.line);
    }
  }
  run(ast);
  if(!frames.length) snap(-1);
  return frames;
}

/* -------- dibujo del escenario -------- */
function fitTransform(trail,W,H){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  trail.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y);});
  if(!isFinite(a)){a=b=c=d=0;}
  const w=Math.max(c-a,1), h=Math.max(d-b,1), pad=36;
  const s=Math.min((W-2*pad)/w,(H-2*pad)/h,8);
  return {s, ox:(W-w*s)/2 - a*s, oy:(H-h*s)/2 - b*s};
}
function drawFrame(cv, frame, fullTrail){
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(148,163,184,.08)'; ctx.lineWidth=1;
  for(let g=0;g<W;g+=26){ctx.beginPath();ctx.moveTo(g,0);ctx.lineTo(g,H);ctx.stroke();}
  for(let g=0;g<H;g+=26){ctx.beginPath();ctx.moveTo(0,g);ctx.lineTo(W,g);ctx.stroke();}
  const tf=fitTransform(fullTrail,W,H);
  const T=p=>({x:p.x*tf.s+tf.ox, y:p.y*tf.s+tf.oy});
  const tr=frame.trail;
  if(tr.length>1){ ctx.strokeStyle='#38bdf8'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath(); tr.forEach((p,k)=>{const q=T(p); k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);}); ctx.stroke(); }
  const pos=T(frame.turtle), ang=(frame.turtle.heading-90)*Math.PI/180;
  ctx.save(); ctx.translate(pos.x,pos.y); ctx.rotate(ang);
  ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-9,-10); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0f172a'; ctx.beginPath(); ctx.arc(-1,0,3.2,0,7); ctx.fill();
  ctx.restore();
  if(frame.say!=null && frame.say!==''){
    ctx.font='13px system-ui'; const txt='💬 '+frame.say; const tw=ctx.measureText(txt).width;
    let bx=pos.x+12, by=pos.y-24; bx=Math.min(bx,W-tw-16); bx=Math.max(bx,6);
    ctx.fillStyle='rgba(15,23,42,.92)'; ctx.strokeStyle='#334155';
    ctx.beginPath(); ctx.roundRect(bx-6,by-16,tw+12,24,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e2e8f0'; ctx.fillText(txt,bx,by);
  }
}

/* -------- montar escenario interactivo -------- */
function fmt(v){ if(typeof v==='boolean') return v?'verdadero':'falso'; return typeof v==='string' ? '"'+v+'"' : v; }
function codeLinesHtml(lines){
  return lines.map((l,i)=>`<div class="cline" data-l="${i}">${paint(l)||' '}</div>`).join('');
}
function simulatable(lines){
  const j=lines.join('\n');
  return /\b(avanzar|girar|rebotar|mostrar|decir|repetir|si)\b/i.test(j) || lines.some(l=>/^\s*[a-zA-Z_]\w*\s*=\s*.+/.test(l));
}
function mountStage(container, lines, opts){
  opts=opts||{};
  const code=lines.join('\n');
  const hasMove=/\b(avanzar|girar|rebotar)\b/i.test(code);
  const hasVar=lines.some(l=>/^\s*[a-zA-Z_]\w*\s*=\s*.+/.test(l));
  const hasShow=/\b(mostrar|decir)\b/i.test(code);
  const frames=simulate(lines);
  const full=frames[frames.length-1].trail;
  container.innerHTML =
    `<div class="cbhdr">La computadora ejecuta tu programa línea por línea:</div>`+
    `<div class="cblock">${codeLinesHtml(lines)}</div>`+
    (hasMove?'<canvas class="stcanvas" width="320" height="200"></canvas>':'')+
    (hasVar?'<div class="vpanel"></div>':'')+
    (hasShow?'<div class="out"></div>':'')+
    `<div class="runctrl">
       <button class="rbtn" data-a="play">▶ Ejecutar</button>
       <button class="rbtn ghost" data-a="step">⏭ Paso</button>
       <button class="rbtn ghost" data-a="reset">↺</button>
     </div>`;
  const codeEl=container.querySelector('.cblock');
  const cv=container.querySelector('.stcanvas');
  const vp=container.querySelector('.vpanel');
  const op=container.querySelector('.out');
  let idx=-1, timer=null;
  function paintFrame(i){
    idx=i;
    const f = i<0 ? {line:-1,vars:{},turtle:{x:0,y:0,heading:0},trail:[{x:0,y:0}],out:[]} : frames[i];
    codeEl.querySelectorAll('.cline').forEach(el=>el.classList.toggle('hot',+el.dataset.l===f.line));
    if(cv) drawFrame(cv,f,full);
    if(vp) vp.innerHTML = Object.keys(f.vars).length
      ? Object.keys(f.vars).map(k=>`<span class="vchip ${f.changed===k?'chg':''}">${k} = <b>${fmt(f.vars[k])}</b></span>`).join('')
      : '<span class="muted" style="font-size:.8rem">(sin variables todavía)</span>';
    if(op) op.innerHTML = f.out.length ? f.out.map(escapeHtml).join('   ')
      : '<span class="muted" style="font-size:.82rem">pantalla</span>';
  }
  function stop(){ if(timer){clearInterval(timer);timer=null;} }
  function play(){ stop(); if(idx>=frames.length-1) idx=-1; timer=setInterval(()=>{
      if(idx>=frames.length-1){stop();return;} paintFrame(idx+1); }, 700); paintFrame(idx+1); }
  function step(){ stop(); if(idx>=frames.length-1) idx=-1; paintFrame(idx+1); }
  container.querySelector('[data-a=play]').onclick=play;
  container.querySelector('[data-a=step]').onclick=step;
  container.querySelector('[data-a=reset]').onclick=()=>{stop();paintFrame(-1);};
  paintFrame(-1);
  if(opts.autoplay) play();
}

/* ---- motor de slides (lo usan la intro de 1ro y las unidades de 2do) ---- */
let _deck=null;
function verSlides(slides, salir, textoFin, alFinal){
  _deck={s:slides, salir, fin:textoFin||'Terminar →', alFinal};
  deckGo(0);
}
function deckGo(i){
  if(!_deck) return menu();
  if(i<0) i=0;
  if(i>=_deck.s.length){ const f=_deck.alFinal; _deck=null; return f?f():menu(); }
  const s=_deck.s[i], n=_deck.s.length;
  app.innerHTML=`<div class="ic">
    <div class="ibar"><i style="width:${(i+1)/n*100}%"></i></div>
    <div class="ik">${s.k} · ${i+1} de ${n}</div>
    <h2>${s.t}</h2>
    ${s.h}
    <div class="inav">
      ${i>0?`<button class="g" onclick="deckGo(${i-1})">← Anterior</button>`:''}
      <button onclick="deckGo(${i+1})">${i+1>=n?_deck.fin:'Siguiente →'}</button>
    </div>
    <div class="idots">${_deck.s.map((_,k)=>`<span class="${k===i?'on':''}" onclick="deckGo(${k})"></span>`).join('')}</div>
  </div>
  <button class="sala" style="width:100%;margin-top:14px;text-align:center" onclick="${_deck.salir}">Salir</button>`;
  window.scrollTo(0,0);
}
function introHome(){ verSlides(INTRO1, 'menu()', 'Ir a las misiones →'); }

 '2do': {
  nom:'Taller de robótica',
  sub:'Programar algo que pase en el mundo real, no en la pantalla.',
  salas:['robot1','sensores','caja','electro'],
  us:[
  /* ---------------- UNIDAD 1 ---------------- */
  { tomaU:1, t:'Sentir, decidir, hacer', d:'Qué es un robot y qué no. Las tres cosas que hace siempre.',
    slides:[
    {k:'Arrancamos',t:'De la pantalla al mundo',h:`
      <div class="ib">Todo lo que programaste hasta ahora pasa <b>adentro de la pantalla</b>:
      el videojuego, los personajes, el marcador.<br><br>
      Ahora vamos por lo mismo pero <b>afuera</b>: una luz que se prende sola, una alarma que
      avisa que va a helar, un riego que arranca cuando la tierra está seca.<br><br>
      <b>Y ya sabés casi todo lo que hace falta.</b> Lo que cambia no es la programación:
      es de dónde salen los datos y qué pasa cuando el programa decide.</div>`},

    {k:'La definición',t:'Un robot hace tres cosas',h:`
      <div class="i3">
        <div class="n a"><div class="t">SE ENTERA</div><div class="d">de algo que pasa en el mundo</div></div>
        <div class="fl">→</div>
        <div class="n b"><div class="t">DECIDE</div><div class="d">qué hacer con esa información</div></div>
        <div class="fl">→</div>
        <div class="n c"><div class="t">HACE</div><div class="d">algo que cambia el mundo</div></div>
      </div>
      <div class="ib">Y lo repite <b>sin parar</b>.<br><br>
      El del medio es el que importa. La puerta del súper <b>se entera</b> de que te acercás
      y <b>abre</b>… pero no decide nada: siempre hace lo mismo. Por eso no es un robot,
      es un automatismo.<br><br>
      Fijate que en ningún lado dice que tenga que tener forma de persona. <b>Eso lo puso el cine.</b></div>`},

    {k:'Sorpresa',t:'Vos ya programaste un sensor',h:`
      <div class="ib">¿Te acordás del laberinto? Usabas este bloque:</div>
      <div class="icur" style="font-family:ui-monospace,monospace;font-size:1.06rem;margin-top:14px">
        si <b>tocando color negro</b> → volver al inicio</div>
      <div class="ib"><b>Eso es exactamente un sensor.</b> El programa se entera de algo
      (chocó la pared) y decide qué hacer.<br><br>
      En el videojuego pasó lo mismo: "si tocando al personaje → sumar un punto".
      Te enterabas de algo y decidías.<br><br>
      En un aparato real el mecanismo es el mismo. En lugar de tocar un color, detecta cuánta luz
      hay, qué temperatura hace o si la tierra está seca. <b>La lógica no cambia; cambia la magnitud
      que se mide.</b></div>`},

    {k:'Las partes',t:'Sensores y actuadores',h:`
      <div class="idos">
        <div class="b"><h4>Sensores — se enteran</h4><ul>
          <li>De <b>luz</b>: si está oscuro</li>
          <li>De <b>temperatura</b>: si hace frío</li>
          <li>De <b>humedad</b>: si la tierra está seca</li>
          <li>De <b>distancia</b>: qué tan cerca hay algo</li>
          <li>Un <b>botón</b> también es un sensor</li></ul></div>
        <div class="b"><h4>Actuadores — hacen</h4><ul>
          <li>Un <b>motor</b>: gira, mueve, abre</li>
          <li>Una <b>lamparita</b>: ilumina</li>
          <li>Un <b>parlante</b>: suena</li>
          <li>Una <b>bomba</b>: mueve agua</li>
          <li>Una <b>pantalla</b>: muestra</li></ul></div>
      </div>
      <div class="idato">Criterio para distinguirlos: <b>el sensor detecta, el actuador ejecuta.</b>
      Si no detecta ninguna magnitud, no es un sensor. Si no produce ningún efecto, no es un actuador.</div>`},

    {k:'Para cerrar',t:'Robots que no parecen robots',h:`
      <div class="ib">Ninguno de estos tiene patas ni cara, y los tres deciden:</div>
      <div class="ipreg" style="margin-top:14px">
        <div>La estufa que se apaga sola al llegar a la temperatura</div>
        <div>El celu que baja el brillo cuando hay poca luz</div>
        <div>El semáforo que mide cuántos autos hay y se adapta</div>
      </div>
      <div class="idato">Identificá otro en tu casa y hacete siempre las mismas tres preguntas:
      <b>¿qué detecta? ¿qué ejecuta? ¿decide algo, o repite siempre la misma acción?</b></div>`}
    ],
    integ:[
      { type:'mc', consigna:'En la escuela quieren un cartel que avise cuando el aula está muy ruidosa. Ya tienen un micrófono y una luz. ¿Qué les falta?',

        explica:'Sensor (micrófono) y actuador (luz) ya están. Falta el del medio: la decisión. Sin programa, la luz estaría siempre prendida o siempre apagada.' },

  /* ---------------- UNIDAD 2 ---------------- */
  { tomaU:2, t:'Elegir y ubicar el sensor', d:'El sensor no interpreta lo que mide: entrega un número. Su ubicación es determinante.',

    {k:'La idea clave',t:'Un sensor traduce el mundo a un número',h:`

    {k:'Dos familias',t:'Digital y analógico',h:`
      <div class="idos">
        <div class="b"><h4>Digital: dos estados</h4><ul>
          <li>Un botón: apretado o no</li>
          <li>Un interruptor: sí o no</li>
          <li>No existe "medio apretado"</li></ul></div>

          <li>Humedad: de 0 a 1023</li>
          <li>Temperatura: −10, 3, 24…</li>

      <div class="ib">Es la misma diferencia que en tus variables: un <b>booleano</b>

    {k:'El error clásico',t:'Dónde ponés el sensor cambia todo',h:`
      <div class="ib">Un aparato debe avisar si hace frío en el exterior, pero le instalan el sensor

    {k:'Elegir bien',t:'Qué quiero saber → qué sensor pongo',h:`
      <div class="idos">
        <div class="b"><h4>Quiero saber…</h4><ul>
          <li>Si se hizo de noche</li>
          <li>Si va a helar</li>
          <li>Si hay que regar</li>

        <div class="b"><h4>Le pongo…</h4><ul>
          <li>Sensor de <b>luz</b></li>
          <li>Sensor de <b>temperatura</b></li>
          <li>Sensor de <b>humedad</b> en la tierra</li>
          <li>Sensor de <b>movimiento</b></li></ul></div>
      </div>
      <div class="idato">Y siempre hace falta <b>uno de cada lado</b>: algo que se entere

    ],
    integ:[
      { type:'mc', consigna:'Querés avisar si en el invernadero de la huerta hiela de madrugada. ¿Dónde ponés el sensor de temperatura?',

      { type:'mc', consigna:'Para ese invernadero, ¿qué combinación tiene sentido?',

        explica:'Hace falta uno de cada lado: algo que se entere y algo que haga. Dos sensores se enteran de todo y no cambian nada; dos actuadores hacen cosas sin saber cuándo.' },

  /* ---------------- UNIDAD 3 ---------------- */
  { tomaU:3, t:'Decidir con un número', d:'El umbral: el número que parte el mundo en dos.',

/* ejercicios de práctica de una unidad (los marcados con u:N) */
function ejsUnidad(curso, ui){
  const T=TALLERES[curso]; if(!T) return [];
  const u=(T.us||[])[ui]||{};
  const propios=(u.ejs||[]).map(e=>Object.assign({},e,{concepto:u.t}));
  return propios.concat((T.salas||[]).flatMap(id=>{
    const s=SALAS.find(x=>x.id===id); if(!s) return [];
    return s.ejs.filter(e=>e.u===(u.tomaU||-1))
      .map(e=>Object.assign({},e,{concepto:s.concepto, sinResultado:!!s.sinResultado}));
  }));
}
/* integrador: los propios de la unidad + una muestra de todo lo anterior,
   y sin revelar la respuesta (para que lo piensen, no lo adivinen) */
function ejsInteg(curso, ui){
  const T=TALLERES[curso]; if(!T) return [];
  const u=T.us[ui];
  const propios=(u.integ||[]).map(e=>Object.assign({},e,{concepto:'Integrador · '+u.t}));
  let previos=[];
  for(let k=0;k<=ui;k++) previos=previos.concat(ejsUnidad(curso,k));
  const muestra=shuffle(previos).slice(0, Math.min(6, previos.length));
  return shuffle(propios.concat(muestra)).map(e=>Object.assign({},e,{sinResultado:true}));
}
function unidadEstado(curso, ui){
  const ej=done[`u-${curso}-${ui}-ej`], it=done[`u-${curso}-${ui}-int`];
  return {ej, it};
}
/* ---- pantallas del taller ---- */
function verUnidad(ui){
  cur=null;
  const curso=SES.anio, T=TALLERES[curso]; if(!T) return menu();
  const u=T.us[ui], nEj=ejsUnidad(curso,ui).length, st=unidadEstado(curso,ui);
  const paso=(titulo,desc,fn,hecho)=>`
    <button class="item wide" onclick="${fn}">
      <div class="n">${titulo}</div>
      <div class="d">${desc}</div>
      ${hecho?`<div class="foot"><span class="hecho">${hecho}</span></div>`:''}
    </button>`;
  app.innerHTML=`
    <div class="topbar"><button class="backb" onclick="menu()">← Unidades</button>
      <div class="progtext">Unidad ${ui+1} de ${T.us.length}</div></div>
    <div class="card">
      <div class="concepto big">${T.nom}</div>
      <h2 style="margin-top:0">${ui+1} · ${u.t}</h2>
      <p class="muted" style="margin:0;line-height:1.6">${u.d}</p>
    </div>
    <div class="grid" style="grid-template-columns:1fr">
      ${paso('Teoría',`${u.slides.length} pantallas para leer de corrido. Empezá por acá.`,`slidesUnidad(${ui})`,'')}
      ${paso('Ejercicios',`${nEj} ejercicios de esta unidad. Con explicación y reintento.`,`startUnidad(${ui},'ej')`, st.ej?`${st.ej.puntos}/${st.ej.total} sin ayuda`:'')}
      ${paso('Integrador','Mezcla esta unidad con las anteriores y <b>no te dice la respuesta</b>. Para ver si de verdad te sale.',`startUnidad(${ui},'int')`, st.it?`${st.it.puntos}/${st.it.total} sin ayuda`:'')}
    </div>`;
  window.scrollTo(0,0);
}
function slidesUnidad(ui){
  const T=TALLERES[SES.anio];
  verSlides(T.us[ui].slides, `verUnidad(${ui})`, 'A los ejercicios →', ()=>startUnidad(ui,'ej'));
}
function startUnidad(ui, tipo){
  const curso=SES.anio, T=TALLERES[curso], u=T.us[ui];
  const ejs = tipo==='int' ? ejsInteg(curso,ui) : shuffle(ejsUnidad(curso,ui));
  if(!ejs.length){ alert('Esta unidad todavía no tiene ejercicios cargados.'); return; }
  const sala={ id:`u-${curso}-${ui}-${tipo==='int'?'int':'ej'}`,
               nom:`U${ui+1} ${u.t} · ${tipo==='int'?'integrador':'ejercicios'}`,
               concepto:u.t, _uni:ui };
  cur={sala, ejs, i:0, puntos:0, streak:0, answered:false,
    modo: MODO.id, tEj: Date.now(),
    reg: ejs.map(e=>({concepto:e.concepto, tipo:e.type||'mc', consigna:txtPlano(e.consigna),
                      intentos:0, ok:false, ok1:false, pistas:0, salteado:false, seg:0}))};
  render();
}
function tallerHTML(){
  const curso=SES.anio, T=TALLERES[curso]; if(!T) return '';
  const items=T.us.map((u,ui)=>{
    const st=unidadEstado(curso,ui), nEj=ejsUnidad(curso,ui).length;
    const marcas=[st.ej?'ejercicios':'',st.it?'integrador':''].filter(Boolean).join(' · ');
    return `<button class="item wide dest" onclick="verUnidad(${ui})">
      <div class="n">${ui+1} · ${u.t}</div>
      <div class="d">${u.d}</div>
      <div class="foot"><span class="lvl">${u.slides.length} pantallas de teoría</span>
        <span class="lvl">${nEj} ejercicios</span>
        <span class="lvl">integrador</span>
        ${marcas?`<span class="hecho">${marcas}</span>`:''}</div>
    </button>`;
  }).join('');
  return `<section class="mod"><div class="mt">${T.nom}</div>
    <div class="md">${T.sub} Cada unidad va en orden: teoría, ejercicios e integrador.</div>
    <div class="grid" style="grid-template-columns:1fr">${items}</div></section>`;
}

let _arduTab='proy';

  const proy=_arduTab==='proy';
  app.innerHTML=`<div class="ardu">
    <div class="arduhead">
      <div>
        <h2>Arduino de verdad</h2>
        <p>Los mismos conceptos de las misiones, ahora en el lenguaje real de la placa.
           Andá a <a href="https://wokwi.com/projects/new/arduino-uno" target="_blank" rel="noopener">wokwi.com</a>
           para simularlo en el navegador, o subilo a una placa si tenés.</p>
      </div>
      <button class="btn ghost" onclick="menu()">← Volver</button>
    </div>
    <div class="ardutabs">
      <button class="atab${proy?' on':''}" onclick="arduHome('proy')">Proyectos <span>${ARDU.length}</span></button>
      <button class="atab${_arduTab==='roto'?' on':''}" onclick="arduHome('roto')">Código roto <span>${ARDU_ROTO.length}</span></button>
      <button class="atab${_arduTab==='glos'?' on':''}" onclick="arduHome('glos')">Glosario</button>
    </div>
    ${_arduTab==='proy'?arduListaHTML():(_arduTab==='roto'?arduRotoHTML():arduGlosHTML())}
  </div>`;
  window.scrollTo(0,0);
}
function arduListaHTML(){
  return `<div class="ardulista">${ARDU.map((p,i)=>`
    <button class="arduitem" onclick="arduVer(${i})">
      <span class="an">${i+1}</span>
      <span class="at"><b>${p.t}</b><i>${p.c}</i></span>
      <span class="aa">→</span>
    </button>`).join('')}</div>`;
}
function arduVer(i){
  const p=ARDU[i]; cur=null;
  app.innerHTML=`<div class="ardu">
    <div class="arduhead">
      <div>
        <p class="akick">Proyecto ${i+1} de ${ARDU.length} · ${p.c}</p>
        <h2>${p.t}</h2>
        <p>${p.q}</p>
      </div>
      <button class="btn ghost" onclick="arduHome('proy')">← Proyectos</button>
    </div>
    <details class="aobj">
      <summary>Qué vas a aprender acá</summary>

    </details>
    <div class="ardugrid">
      <div class="acard"><h4>Qué vas a necesitar</h4><ul>${p.n.map(x=>`<li>${x}</li>`).join('')}</ul></div>

    </div>

    </div>

    <div class="ardunav">

      ${i<ARDU.length-1?`<button class="btn" onclick="arduVer(${i+1})">${ARDU[i+1].t} →</button>`:`<button class="btn" onclick="arduHome('roto')">Ir al código roto →</button>`}
    </div>
  </div>`;

function arduCopiar(i){
  const t=ARDU[i].code, b=document.getElementById('acopy');
  const ok=()=>{ b.textContent='Copiado'; setTimeout(()=>{b.textContent='Copiar';},1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok).catch(()=>arduCopiarFallback(t,ok));
  } else arduCopiarFallback(t,ok);
}
function arduCopiarFallback(t,ok){
  const a=document.createElement('textarea'); a.value=t;
  a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a);
  a.select(); try{ document.execCommand('copy'); ok(); }catch(e){}
  document.body.removeChild(a);
}

function menu(){

  if(!SES) return pantallaIdentidad();

     a la casa de dibujos y no al menú de texto. Ver "CASA DE IMÁGENES". */

  recalcDone(); pintarSesbar();

  let h = `<div class="ronda${MODO.id==='desafio'?' on':''}">
      <div class="tx"><b>Modo ${MODOS[MODO.id].n}.</b> ${MODOS[MODO.id].d}<br>

    </div>`;

  h += tallerHTML();

      items += itemHTML({n:sala.nom, d:sala.desc, fn:`startSala('${ent.id}')`,

/* -------------------- ARRANCAR SALA -------------------- */
function startSala(id){
  let sala, ejs;
  if(id==='mezcla'){
    sala = {id:'mezcla', nom:'Modo mezcla', concepto:'Todos los conceptos'};
    ejs = shuffle(entradasAnio(SES.anio).flatMap(ejsDeSala)).slice(0,8);
  } else {
    const ent = entradasAnio(SES.anio).find(e=>e.id===id) || {id};
    sala = SALAS.find(s=>s.id===id);
    ejs = shuffle(ejsDeSala(ent));
  }
  cur = {sala, ejs, i:0, puntos:0, streak:0, answered:false,
    modo: MODO.id,
    tEj: Date.now(),
    reg: ejs.map(e=>({concepto:e.concepto, tipo:e.type||'mc', consigna:txtPlano(e.consigna),
                      intentos:0, ok:false, ok1:false, pistas:0, salteado:false, seg:0}))};
  render();
}

/* -------------------- RENDER EJERCICIO -------------------- */
function render(){
  if(cur.i >= cur.ejs.length){ return finSala(); }
  const ej = cur.ejs[cur.i], n=cur.ejs.length, pct=Math.round(cur.i/n*100);
  const volver = cur.sala._uni!==undefined ? `verUnidad(${cur.sala._uni})` : 'menu()';
  let h = `<div class="topbar">
      <button class="backb" onclick="${volver}">← ${cur.sala._uni!==undefined?'Unidad':'Salas'}</button>
      <div class="progtext">${cur.modo==='desafio'?'<span class="cchip">desafío</span> &nbsp;':''}${
      cur.modo==='presenta'?`<span class="cchip" style="background:var(--accent-dim);color:var(--accent)">intento ${(cur.reg[cur.i]&&cur.reg[cur.i].intentos||0)+1}</span> &nbsp;`:''
      }${cur.i+1}/${n} · <span class="score">${cur.puntos} pts</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card">
      <div class="concepto big">${ej.concepto}</div>
      <div class="consigna">${ej.consigna}</div>`;

  if(ej.svg) h += `<div class="flow">${ej.svg}</div>`;
  if(ej.code) h += `<div class="cbhdr">La computadora ejecuta esto línea por línea:</div><div class="code">${paint(ej.code)}</div>`;

  if(ej.type==='order')    h += renderOrder(ej);
  else if(ej.type==='bug') h += renderBug(ej);
  else                     h += renderChoice(ej);

  h += `<div id="fb"></div></div>`;
  app.innerHTML = h;
  cur.answered=false;
  if(ej.type==='order') mountOrder(ej);
}

/* ---- opción múltiple (mc / fill) ---- */
function renderChoice(ej){
  const mono = ej.type==='fill';
  const opts = ej._opts || (ej._opts = shuffle(ej.opts.map((t,i)=>({txt:t, ok:i===ej.correcta}))));
  let h='<div class="opts">';
  opts.forEach((o,idx)=> h+=`<button class="opt ${mono?'mono':''}" onclick="answerChoice(${idx})">${escapeHtml(o.txt)}</button>`);
  return h+'</div>';
}
function answerChoice(idx){
  if(cur.answered) return; cur.answered=true;
  const ej=cur.ejs[cur.i];
  app.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true;
    if(ej._opts[i].ok) b.classList.add('ok'); else if(i===idx) b.classList.add('no'); });
  feedback(ej._opts[idx].ok, ej.explica);
}

/* ---- cazá el error (bug) ---- */
function renderBug(ej){
  let h='<div class="opts">';
  ej.lineas.forEach((l,idx)=> h+=`<button class="opt mono" onclick="answerBug(${idx})">${escapeHtml(l===''?' ':l)}</button>`);
  return h+'</div><p class="muted" style="font-size:.82rem;margin-top:8px">Tocá la línea que tiene el error</p>';
}
function answerBug(idx){
  if(cur.answered) return; cur.answered=true;
  const ej=cur.ejs[cur.i];
  app.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true;
    if(i===ej.bug) b.classList.add('ok'); else if(i===idx) b.classList.add('no'); });
  feedback(idx===ej.bug, ej.explica);
}

/* ---- ordená el código (parsons) ---- */
let orderState;
function renderOrder(ej){
  return `<div class="parsons">
    <div class="pcol"><h4>Bloques disponibles</h4><div class="pbin" id="pbin"></div></div>
    <div class="pcol"><h4>Tu programa</h4><div class="pbuild" id="pbuild"></div></div>
  </div>
  <div id="stageOrder"></div>
  <button class="btn" id="checkBtn" onclick="checkOrder()" disabled>Comprobar</button>`;
}
function mountOrder(ej){
  orderState = { bin: shuffle(ej.correcto.map((t,i)=>({t,i}))), build:[] };
  drawOrder();
}
function drawOrder(){
  const ej=cur.ejs[cur.i];
  const bin=document.getElementById('pbin'), build=document.getElementById('pbuild');
  bin.innerHTML = orderState.bin.length ? '' : '<div class="emptyhint">— vacío —</div>';
  orderState.bin.forEach((o)=>{
    const el=document.createElement('div'); el.className='pline'; el.innerHTML=paint(o.t);
    el.onclick=()=>{ orderState.bin.splice(orderState.bin.indexOf(o),1); orderState.build.push(o); drawOrder(); }; bin.appendChild(el);
  });
  build.innerHTML = orderState.build.length ? '' : '<div class="emptyhint">Tocá los bloques en orden ↑</div>';
  orderState.build.forEach((o)=>{
    const el=document.createElement('div'); el.className='pline'; el.innerHTML=paint(o.t);
    el.onclick=()=>{ orderState.build.splice(orderState.build.indexOf(o),1); orderState.bin.push(o); drawOrder(); }; build.appendChild(el);
  });
  const full = orderState.bin.length===0 && orderState.build.length>0;
  const btn=document.getElementById('checkBtn'); if(btn) btn.disabled=!full;
  // escenario "probar mi orden"
  const stg=document.getElementById('stageOrder');
  if(stg){
    const lines=orderState.build.map(o=>o.t);
    if(full && simulatable(lines)){
      stg.innerHTML='<div class="sttitle" style="margin-top:12px">Probá tu orden antes de comprobar</div><div class="stage" id="stgO"></div>';
      mountStage(document.getElementById('stgO'), lines);
    } else stg.innerHTML='';
  }
}
function checkOrder(){
  if(cur.answered) return;
  const ej=cur.ejs[cur.i]; let good=true;
  const built=orderState.build.map(o=>o.t);   // comparar por TEXTO (soporta bloques repetidos)
  document.querySelectorAll('#pbuild .pline').forEach((el,k)=>{
    el.classList.add('locked'); el.onclick=null;
    const ok=built[k]===ej.correcto[k]; el.classList.add(ok?'okline':'noline'); if(!ok) good=false;
  });
  document.getElementById('checkBtn').disabled=true;
  document.querySelectorAll('#pbin .pline').forEach(el=>el.onclick=null);
  document.getElementById('stageOrder').innerHTML='';
  cur.answered=true;
  let extra=ej.explica;
  if(!good && !ej.sinResultado){
    const orden=ej.correcto.map((t,k)=>`${k+1}. ${t}`).join('<br>');
    extra += `<div style="margin-top:10px;padding:10px;background:#0b1220;border-radius:8px;font-size:.88rem"><b>El orden correcto es:</b><br>${orden}</div>`;
  }
  feedback(good, extra);
}

/* -------------------- FEEDBACK -------------------- */
function hintFor(ej){
  if(ej.pista) return ej.pista;
  if(ej.type==='order') return 'Probá tu orden con ▶ y fijate si hace lo que pide la consigna. Corregí lo que no encaje.';
  if(ej.type==='fill')  return 'Pensá qué tiene que pasar para que el programa cumpla la consigna, y probá esa opción.';
  if(ej.type==='bug')   return 'Leé línea por línea imaginando qué hace cada una. ¿Cuál NO hace lo que debería?';
  if(ej.code)           return 'Seguí el programa línea por línea y anotá el valor de cada variable. ¿Con qué valor llega al "mostrar"?';
  return 'Descartá las opciones que claramente no tienen sentido y quedate con la que mejor lo explica.';
}
function showHint(){
  if(cur.reg[cur.i]) cur.reg[cur.i].pistas++;
  const b=document.getElementById('hintBox');
  if(b) b.innerHTML=`<div class="fb" style="background:rgba(56,189,248,.12);border-left:4px solid var(--accent);margin-top:0"><b>Pista:</b> ${hintFor(cur.ejs[cur.i])}</div>`;
}
function feedback(good, explica){
  /* registro honesto: el primer intento es el que dice si lo entendió */
  const r=cur.reg[cur.i];
  if(r){ r.intentos++; if(good){ r.ok=true; if(r.intentos===1) r.ok1=true; } }
  if(good){ if(cur.scored!==cur.i){ cur.puntos++; cur.streak++; cur.scored=cur.i; } } else { cur.streak=0; }
  const ej=cur.ejs[cur.i];
  const fb=document.getElementById('fb');
  const last = cur.i+1>=cur.ejs.length;
  const modo = cur.modo;
  const irSiguiente = `<button class="btn" onclick="next()">${last?'Ver resultado':'Siguiente →'}</button>`;

  /* ---- DESAFÍO: un intento, sin pistas. La explicación solo si acertó ---- */
  if(modo==='desafio'){
    fb.innerHTML = good
      ? `<div class="fb good"><span class="t">Correcto</span>${explica}</div>${irSiguiente}`
      : `<div class="fb bad"><span class="t">No es esa</span>Queda anotada. Cuando termines la ronda
           podés volver a hacer la sala en modo práctica y ver por qué.</div>${irSiguiente}`;
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }

  /* ---- resuelto: acá llega la explicación, en los dos modos ---- */
  if(good){
    const racha = cur.streak>=3 ? `<div class="streak">Racha de ${cur.streak}</div>` : '';
    const cuantos = (r && r.intentos>1) ? `<div class="streak" style="background:none;color:var(--muted);padding-left:0">Te llevó ${r.intentos} intentos.</div>` : '';
    fb.innerHTML = `<div class="fb good"><span class="t">Correcto</span>${explica}${cuantos}${racha}</div>
      <div id="stageWrap"></div>${irSiguiente}`;
    if(runnableStage(ej) && ej.type!=='order'){
      const sw=document.getElementById('stageWrap');
      sw.innerHTML='<div class="sttitle" style="margin-top:14px">Cómo corre este código</div><div class="stage" id="stgFb"></div>';
      mountStage(document.getElementById('stgFb'), getRunLines(ej), {autoplay:true});
    }
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }

  /* ---- error ---- */
  const reintentar = `<button class="btn" onclick="retry()">Corregir y reintentar</button>
      <button class="btn ghost" onclick="saltear()">${last?'Ver resultado':'Saltear sin corregir →'}</button>`;

  if(modo==='presenta' && !ej.sinResultado){
    /* presentación: la explicación se ve enseguida, para leerla entre todos */
    fb.innerHTML = `<div class="fb bad"><span class="t">Todavía no — leé esto y volvé a intentar:</span>${explica}</div>
      <div id="stageWrap"></div>${reintentar}`;
  } else {
    /* práctica: la explicación no aparece hasta que lo resuelva. Solo pista si la pide */
    fb.innerHTML = `<div class="fb bad"><span class="t">Todavía no</span>Revisalo con calma y volvé a intentar.
        Pensalo, no adivines.</div>
      <button class="btn ghost" onclick="showHint()">Ver una pista</button>
      <div id="hintBox"></div>
      ${reintentar}`;
  }
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function retry(){ render(); }   // mismo ejercicio, intento nuevo (no reshuffle de opciones en mc)
function cerrarTiempo(){
  const r=cur.reg[cur.i];
  if(r) r.seg += Math.max(0, Math.round((Date.now()-cur.tEj)/1000));
}
function next(){ cerrarTiempo(); cur.i++; cur.tEj=Date.now(); render(); }
function saltear(){ if(cur.reg[cur.i]) cur.reg[cur.i].salteado=true; next(); }

function shapeHint(ang){
  const nice={30:'un dodecágono, 12 lados, casi un círculo',36:'un decágono',45:'un octágono, 8 lados',60:'un hexágono (6 lados) ⬡',
    72:'un pentágono, 5 lados',90:'un cuadrado',120:'un triángulo',144:'una estrella de 5 puntas',180:'una línea que va y vuelve'};
  if(nice[ang]) return `Con giro <b>${ang}°</b> intentás dibujar <b>${nice[ang]}</b>.`;
  if(360%ang===0) return `Con giro <b>${ang}°</b> la figura cierra en <b>${360/ang} lados</b> (360 ÷ ${ang}).`;
  return `Giro <b>${ang}°</b>: no divide justo a 360, ¡así que sale una espiral o figura abierta! 🌀`;
}

/* -------------------- MODO Jr (nivel ScratchJr, sin lectura, con voz) -------------------- */
/* Los puntitos de arriba: cada uno lleva a su nivel, y ⏭️ saltea al que sigue.
   Nada queda bloqueado: si un nivel no sale, se pasa al otro y se vuelve después. */
function puntosNivel(total, idx, fn){
  let h='';
  for(let k=0;k<total;k++) h+=`<button class="nivdot${k===idx?' on':''}" onclick="${fn}(${k})" aria-label="nivel ${k+1}">${k===idx?'●':'○'}</button>`;
  if(idx<total-1) h+=`<button class="nivdot salta" onclick="${fn}(${idx+1})" aria-label="saltear">⏭️</button>`;
  return h;
}
const JR_ICON={U:'⬆️',D:'⬇️',L:'⬅️',R:'➡️'};
const JR=[
  // fáciles
  { char:'🐢', goal:'⭐', cols:3, rows:1, start:{c:0,r:0}, target:{c:2,r:0} },
  { char:'🐱', goal:'🍎', cols:4, rows:1, start:{c:0,r:0}, target:{c:3,r:0} },
  { char:'🚗', goal:'🏁', cols:5, rows:1, start:{c:0,r:0}, target:{c:4,r:0} },
  { char:'🐝', goal:'🌻', cols:1, rows:4, start:{c:0,r:3}, target:{c:0,r:0} },
  { char:'🐶', goal:'🦴', cols:2, rows:2, start:{c:0,r:0}, target:{c:1,r:1} },
  { char:'🐰', goal:'🥕', cols:3, rows:2, start:{c:0,r:1}, target:{c:2,r:0} },
  { char:'🐸', goal:'🍃', cols:4, rows:2, start:{c:0,r:0}, target:{c:3,r:1}, walls:[{c:2,r:0}] },
  // difíciles: grillas más grandes, giros y paredes 🧱
  { char:'🐢', goal:'⭐', cols:4, rows:3, start:{c:0,r:2}, target:{c:3,r:0} },
  { char:'🐱', goal:'🍎', cols:4, rows:3, start:{c:0,r:0}, target:{c:3,r:2}, walls:[{c:1,r:1},{c:2,r:1}] },
  { char:'🚗', goal:'🏁', cols:5, rows:3, start:{c:0,r:1}, target:{c:4,r:1}, walls:[{c:2,r:1}] },
  { char:'🐭', goal:'🧀', cols:5, rows:4, start:{c:0,r:3}, target:{c:4,r:0}, walls:[{c:2,r:1},{c:2,r:2},{c:2,r:3}] },
  { char:'🐢', goal:'⭐', cols:5, rows:5, start:{c:0,r:4}, target:{c:4,r:0}, walls:[{c:1,r:3},{c:3,r:1},{c:2,r:2}] },
];
function jrWall(m,c,r){ return (m.walls||[]).some(w=>w.c===c&&w.r===r); }
let jrState;
function jrMission(idx){
  cur=null;
  const m=JR[idx];
  jrState={idx, m, prog:[], pos:{c:m.start.c,r:m.start.r}, playing:false,
           intentos:0, t0:Date.now(), cur:-1};
  jrRender();
}
/* la celda se achica sola cuando la grilla es ancha, así nunca se corta */
function jrCelda(cols){ return cols<=3?116:cols===4?104:88; }
function jrRender(msg){
  const {m,prog}=jrState, showUD=m.rows>1;
  let cells='';
  for(let r=0;r<m.rows;r++) for(let c=0;c<m.cols;c++){
    const isGoal=(c===m.target.c&&r===m.target.r), isChar=(c===jrState.pos.c&&r===jrState.pos.r), isWall=jrWall(m,c,r);
    cells+=`<div class="jrcell ${isGoal?'goal':''} ${isWall?'wall':''}">${isChar?m.char:(isWall?'🧱':(isGoal?m.goal:''))}</div>`;
  }
  const dots=puntosNivel(JR.length, jrState.idx, 'jrMission');
  app.innerHTML=`
    <div class="topbar"><button class="backb" onclick="menu()" aria-label="volver">←</button>
      <div class="progtext" style="letter-spacing:3px;color:var(--b1)">${dots}</div>
      <div class="baopts">${btnsAyuda(false)}</div></div>
    <div class="card jrwrap">
     <div class="jrcols">
      <div>
        <div style="font-size:3.4rem;margin:2px 0 10px;line-height:1">${m.char}<span style="font-size:2rem;opacity:.5;margin:0 16px">➡️</span>${m.goal}</div>
        <div class="jrgrid" style="--jrc:${jrCelda(m.cols)}px;grid-template-columns:repeat(${m.cols},${jrCelda(m.cols)}px)">${cells}</div>
      </div>
      <div>
        <div class="jrmsg" role="status" aria-live="polite">${msg||''}</div>
        <div class="jrstrip" aria-label="tu camino">${prog.length?prog.map((a,k)=>`<span class="${k===jrState.cur?'jrnow':''}">${JR_ICON[a]}</span>`).join(' '):'<span style="opacity:.3;font-size:1.5rem">▫️ ▫️ ▫️</span>'}</div>
        ${showUD?`<div class="jrbtns"><button class="jrbtn" onclick="jrAdd('U')" aria-label="arriba">⬆️</button></div>`:''}
        <div class="jrbtns">
          <button class="jrbtn" onclick="jrAdd('L')" aria-label="izquierda">⬅️</button>
          <button class="jrbtn" onclick="jrAdd('R')" aria-label="derecha">➡️</button>
        </div>
        ${showUD?`<div class="jrbtns"><button class="jrbtn" onclick="jrAdd('D')" aria-label="abajo">⬇️</button></div>`:''}
        <div class="jrbtns" style="margin-top:14px">
          <button class="jrgo" onclick="jrRun()" aria-label="que empiece">▶</button>
          <button class="jrbtn" onclick="jrUndo()" aria-label="borrar el último">↩️</button>
          <button class="jrbtn" onclick="jrClear()" aria-label="borrar">🗑️</button>
        </div>
      </div>
     </div>
    </div>`;
}
const JR_F={U:880,D:392,L:523.25,R:659.25};
const JR_NOM={U:'arriba',D:'abajo',L:'izquierda',R:'derecha'};
function jrAdd(a){
  if(jrState.playing) return;
  jrState.prog.push(a);
  tono(JR_F[a],.26); decir(JR_NOM[a]);
  jrRender();
}
function jrUndo(){ if(jrState.playing || !jrState.prog.length) return; jrState.prog.pop(); tono(392,.12); jrRender(); }
function jrClear(){ if(jrState.playing) return; jrState.prog=[]; jrState.pos={c:jrState.m.start.c,r:jrState.m.start.r}; jrRender(); }
function jrRun(){
  if(jrState.playing || !jrState.prog.length) return;
  jrState.playing=true; jrState.intentos++;
  jrState.pos={c:jrState.m.start.c,r:jrState.m.start.r};
  const steps=jrState.prog.slice(), st=jrState; let i=0;
  const tick=()=>{
    if(jrState!==st) return;   // cambió de nivel a mitad del recorrido
    if(i>=steps.length){ jrFinish(); return; }
    const a=steps[i++], p=jrState.pos, m=jrState.m;
    let nc=p.c, nr=p.r;
    if(a==='R') nc++; else if(a==='L') nc--; else if(a==='U') nr--; else if(a==='D') nr++;
    if(nc>=0&&nc<m.cols&&nr>=0&&nr<m.rows&&!jrWall(m,nc,nr)){ p.c=nc; p.r=nr; tono(JR_F[a],.24); }  // clamp + paredes bloquean
    else tono(160,.14);   // chocó: se ve que no se movió y además se escucha
    jrState.cur=i-1; jrRender(); setTimeout(tick,520);
  };
  setTimeout(tick,300);
}
function jrFinish(){
  const {pos,m,idx}=jrState; jrState.playing=false; jrState.cur=-1;
  if(pos.c===m.target.c && pos.r===m.target.r){
    const last=idx>=JR.length-1;
    sonarOk();
    guardarVisual('jr','Modo Jr','Secuencia de pasos','Camino '+(idx+1),
                  jrState.intentos, Math.round((Date.now()-jrState.t0)/1000));
    const msg=app.querySelector('.jrmsg'); if(msg) msg.innerHTML='🎉 🌟 👏';
    const wrap=app.querySelector('.jrwrap');
    if(wrap){ const b=document.createElement('div'); b.className='jrbtns'; b.style.marginTop='12px';
      b.innerHTML = last ? `<button class="jrgo" onclick="menu()" aria-label="terminar">🏆</button>`
                         : `<button class="jrgo" onclick="jrMission(${idx+1})" aria-label="seguir">➡️ 🎈</button>`;
      wrap.appendChild(b); }
  } else {
    sonarNo();
    const msg=app.querySelector('.jrmsg'); if(msg) msg.innerHTML='🤔 🔁';
    setTimeout(()=>{ jrState.pos={c:jrState.m.start.c,r:jrState.m.start.r}; jrRender(); }, 1100);
  }
}

/* Guarda una actividad visual (Jr, baile) con la MISMA forma que una tanda
   normal, para que aparezca en el panel docente y en la planilla sin tocar
   nada más. Una fila por camino o coreografía terminada. */
function guardarVisual(sala, salaNom, concepto, etiqueta, intentos, seg){
  if(!SES) return false;
  const ok1 = intentos<=1;
  return DB.add({
    id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    alumno:SES.nombre, anio:SES.anio, fecha:SES.fecha, ts:new Date().toISOString(),
    sala, salaNom, modo:'practica',
    total:1, resueltos:1, sinAyuda: ok1?1:0,
    pistas:0, salteadas:0, seg,
    ejs:[{c:concepto, t:'visual', q:etiqueta, i:intentos, ok:true, ok1, p:0, s:false, sg:seg}]
  });
}

/* ============================================================
   SONIDO — se sintetiza en el momento, no hay archivos ni internet
   ------------------------------------------------------------
   REGLA: el sonido SIEMPRE acompaña algo que ya se ve. Nunca lleva
   información solo. Alrededor de 1 de cada 3 chicos con síndrome de
   Down tiene alguna pérdida auditiva, y la memoria auditiva a corto
   plazo es justo el punto débil del perfil, mientras que la visual es
   una fortaleza. Así que el sonido es REFUERZO, no canal: si está
   apagado o no se escucha, la actividad funciona igual.
   Se apaga con el botón 🔊 y queda apagado en esa máquina.
   ============================================================ */
const K_SND='pps.sonido.v1', K_PAL='pps.palabras.v1';
function _lee(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } }
let SND=_lee(K_SND,true);     // tonos y voz
let PALAB=_lee(K_PAL,false);  // mostrar la palabra debajo del ícono
let _ac=null;
function ac(){
  if(_ac) return _ac;
  try{ _ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _ac=null; }
  return _ac;
}
function tono(freq,dur){
  if(!SND) return;
  const c=ac(); if(!c) return;
  try{
    if(c.state==='suspended') c.resume();
    const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function melodia(notas,paso){ notas.forEach((f,i)=>setTimeout(()=>tono(f,.3), i*(paso||140))); }
function sonarOk(){ melodia([523.25,659.25,783.99,1046.5],125); }
function sonarNo(){ melodia([329.63,261.63],190); }
/* la voz dice el nombre del paso: suma vocabulario, pero lo que manda
   es el ícono. Si la máquina no tiene voces instaladas, no pasa nada. */
function decir(txt){
  if(!SND||!txt) return;
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='es-AR'; u.rate=.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function toggleSonido(){
  SND=!SND;
  try{ localStorage.setItem(K_SND,JSON.stringify(SND)); }catch(e){}
  if(SND) tono(659.25,.2);
  if(document.querySelector('.bawrap')) baRender();
  else if(document.querySelector('.jrwrap')) jrRender();
  else if(document.querySelector('.gewrap')) geRender();
  else if(document.querySelector('.powrap')) poRender();
}
function togglePalabras(){
  PALAB=!PALAB;
  try{ localStorage.setItem(K_PAL,JSON.stringify(PALAB)); }catch(e){}
  if(document.querySelector('.bawrap')) baRender();
}
/* los dos interruptores, chiquitos y arriba a la derecha: son para la
   docente, no para la alumna */
function btnsAyuda(conPalabras){
  return `<button class="baopt" onclick="toggleSonido()" title="sonido"
      aria-label="${SND?'apagar el sonido':'prender el sonido'}">${SND?'🔊':'🔇'}</button>`+
    (conPalabras?`<button class="baopt" onclick="togglePalabras()" title="palabras"
      aria-label="${PALAB?'ocultar las palabras':'mostrar las palabras'}"
      style="font-size:.95rem;font-weight:700;${PALAB?'':'opacity:.45'}">Aa</button>`:'');
}

/* ---- teclado ----
   Todo lo que se hace con el mouse se puede hacer con el teclado: flechas
   para el camino, 1 a 6 para los pasos del baile, Enter para arrancar,
   Borrar para limpiar, Esc para volver. Es WCAG 2.1.1, y en la práctica
   sirve cuando el mouse cuesta. Sólo actúa dentro de la sección Jr. */
document.addEventListener('keydown', e=>{
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const enJr=!!document.querySelector('.jrwrap'), enBa=!!document.querySelector('.bawrap'),
        enPo=!!document.querySelector('.powrap'),
        enGe=!!document.querySelector('.gewrap');
  if(!enJr && !enBa && !enPo && !enGe) return;
  const k=e.key, enBoton=!!(e.target && e.target.tagName==='BUTTON');
  if(k==='Escape'){ e.preventDefault(); menu(); return; }
  const arrancar=(k==='Enter'||k===' ') && !enBoton;   // si el foco está en un botón, que lo maneje el botón
  const limpiar = k==='Backspace'||k==='Delete';
  if(enJr && jrState){
    const a={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[k];
    if(a){ if(jrState.m.rows>1 || a==='L' || a==='R'){ e.preventDefault(); jrAdd(a); } return; }
    if(arrancar){ e.preventDefault(); jrRun(); return; }
    if(limpiar){ e.preventDefault(); jrClear(); return; }
  }
  if(enBa && baState){
    const i='123456'.indexOf(k);
    if(i>=0){ e.preventDefault(); baAdd(BA_PASOS[i].id); return; }
    if(arrancar){ e.preventDefault(); baRun(); return; }
    if(limpiar){ e.preventDefault(); baClear(); return; }
  }
});

/* ============================================================
   CASA DE IMÁGENES — la pantalla de inicio, sin una sola palabra
   ------------------------------------------------------------
   Para quien todavía no lee. El menú normal, la pantalla de "poné tu
   nombre" y las tarjetas con descripción son todas barreras de lectura
   antes de llegar a la actividad, que sí es visual.
   Se prende UNA VEZ POR MÁQUINA desde la pantalla de identidad (botón
   🖼️): la docente escribe el nombre ahí y listo. Desde entonces esa PC
   abre directo acá — dos dibujos grandes — y el ← de las actividades
   vuelve a esta pantalla, nunca al menú de texto.
   El ⚙️ chiquito de abajo devuelve la máquina al menú normal.

const K_IMG='pps.imagenes.v1';
let MODOIMG=_lee(K_IMG,false);
function casaImagenes(){

        <button class="casab" onclick="poInicio(0)" aria-label="poner en su lugar">🧩</button>
